/* ---------- 일하기 ---------- */
function eff(p,k){return p.sk[k]*(0.55+0.45*p.hp/100)*(p.inj>0?.5:1)*(p.sick>0?.4:1)}
function waterSource(){return S.discovered.spring?'spring':(S.flags.well?'well':null)}
function rainy(){return S.weather==='비'||S.weather==='폭풍'}
function give(p,k,a){if(!(a>0))return;S.gain[k]=(S.gain[k]||0)+a;p.contrib+=a;p.lastGain+=a;if(k!=='wood'&&(S.rule==='none'||p.exiled))p.stash[k]+=a;else S[k]+=a}
function hidden(){return Object.keys(ZONES).filter(z=>!S.discovered[z])}
function sickCount(){return isl().filter(p=>p.sick>0).length}

function scoreActs(p,forIsland){
  const n=Math.max(1,act().length);
  const communal=S.rule!=='none'&&!p.exiled;
  const fN=forIsland?clamp(1-S.food/(n*1.6),0,1):clamp(((100-p.sat)/100)*.6+(communal?clamp(1-S.food/(n*1.6),0,1)*.5:clamp(1-p.stash.food/2,0,1)*.5),0,1.2);
  const wN=forIsland?clamp(1-S.water/(n*1.6),0,1):clamp(((100-p.hyd)/100)*.7+(communal?clamp(1-S.water/(n*1.6),0,1)*.5:clamp(1-p.stash.water/2,0,1)*.5),0,1.3);
  const ws=waterSource(),sc={},storm=S.weather==='폭풍';
  sc.fish=S.noSeaDay===S.day?0:fN*(.45+p.sk.fish)*(storm?.25:1)*clamp(S.stocks.fish/80,.35,1.1);
  sc.forage=fN*(.35+p.sk.gather)*.85*clamp(S.stocks.fruit/80,.3,1.1);
  sc.palm=(fN*.45+wN*.85)*(.35+p.sk.gather)*clamp(S.stocks.palm/80,.25,1.1);
  sc.water=wN*(ws?1.35:(rainy()?1.5:.15));
  if(p.exiled){sc.wood=sc.build=sc.signal=sc.heal=sc.explore=0;sc.rest=(100-p.hp)/100*.7+r()*.1;return sc}
  sc.wood=(S.wood<3?.55:S.wood<8?.3:.1)*(.6+p.t.coop*.4);
  sc.build=(S.shelter<70?(1-S.shelter/100)*.55:.04)*(.35+p.sk.build);
  sc.signal=(S.day>=2?(1-S.signal/100)*.5:.05)*(.3+p.sk.signal)*(S.wood>=1?1:.35)*(.6+p.t.coop*.5);
  const h=hidden();
  sc.explore=h.length?(.12+p.t.brave*.4+(!ws&&wN>.4?.35:0))*(.35+p.sk.explore)*(storm?.3:1):0;
  sc.heal=sickCount()>0?(p.sk.heal+p.t.empathy*.4)*.9:0;
  sc.rest=(100-p.hp)/100*.8+(1-p.t.stamina)*.12+(p.mor<30?.2:0)+(S.siestaDay===S.day&&S.phase===1?1.2:0);
  if(!forIsland&&communal)sc.rest+=p.t.greed*(1-p.t.coop)*.38+(p.lazy?.3:0);
  return sc;
}
function chooseAct(p,cnt){
  if(p.hp<28||(p.sick>0&&chance(.7)))return 'rest';
  const L=leader();let forIsland=false;
  if(L&&L!==p&&!p.exiled&&(p.rel[L.id]>8||p.t.coop>.65)&&chance(.55+p.t.coop*.3))forIsland=true;
  if(L===p&&chance(.5))forIsland=true;
  p.ordered=forIsland&&L&&L!==p;
  const sc=scoreActs(p,forIsland);
  let bk='rest',bv=-1;for(const k in sc){const v=sc[k]+r()*.22-(cnt&&(k==='water'||k==='explore'||k==='signal'||k==='heal')?(cnt[k]||0)*.05:0);if(v>bv){bv=v;bk=k}}
  return bk;
}
function campZone(){return S.flags.cave?'cave':'camp'}
function zoneOf(p,a){
  if(a==='water')return waterSource()==='spring'?'spring':'camp';
  if(a==='explore'){const h=hidden();return h.length?pick(h):'jungle'}
  const m={fish:S.discovered.north&&chance(.35)?'north':'sea',palm:'palm',forage:'jungle',wood:'jungle',build:campZone(),signal:'hill',rest:campZone(),heal:campZone()};
  let z=m[a]||'camp';if(p.exiled&&a==='rest')z=S.discovered.north?'north':'palm';return z;
}
function doAct(p){
  const a=p.act,w=S.weather,wm=w==='폭풍'?.25:w==='비'?.7:w==='폭염'?.85:1;p.lastGain=0;
  if(a==='fish'){
    const e=eff(p,'fish');const f=(.5+1.45*e)*wm*(S.flags.trap?1.4:1)*(S.tools>0?1.15:1)*clamp(S.stocks.fish/S.fishMax,.3,1);
    S.stocks.fish=Math.max(0,S.stocks.fish-f*1.3);give(p,'food',f);p.st.fished+=f;S.menu.fish=1;
    if(f>1.3)bub(p,`물고기 ${Math.round(f*2.5)}마리!`);
    if(w==='폭풍'&&chance(.12)){p.inj=ri(3,6);log(`${j(p.name,'이/가')} 거친 파도에 바위로 떠밀려 다쳤다.`,'bad');rec(p,'폭풍 속에 낚시를 하다 다쳤다',2);bub(p,'으악!')}
  }else if(a==='palm'){
    const e=eff(p,'gather'),k=clamp(S.stocks.palm/80,.25,1);give(p,'food',(.35+.5*e)*k);give(p,'water',(.4+.7*e)*k);S.stocks.palm=Math.max(0,S.stocks.palm-3.2);S.menu.palm=1;
    if(chance(.025)){p.inj=ri(2,5);log(`${j(p.name,'이/가')} 야자나무에서 미끄러져 발목을 다쳤다.`,'bad');bub(p,'발목이…')}
  }else if(a==='forage'){
    const e=eff(p,'gather'),k=clamp(S.stocks.fruit/80,.3,1);give(p,'food',(.45+1.0*e)*k*(S.flags.fruitOk?1.25:.75));S.stocks.fruit=Math.max(0,S.stocks.fruit-3);S.menu.fruit=1;
    if(!S.flags.fruitOk&&!p.botanist&&chance(.06)){p.sick=ri(2,4);log(`${j(p.name,'이/가')} 낯선 열매를 먹고 배를 움켜쥐었다.`,'bad');bub(p,'배가…')}
  }else if(a==='water'){
    const e=eff(p,'gather'),ws=waterSource();let v;
    if(rainy())v=1.2+(S.flags.catcher?1.3:0)+(ws==='spring'?.6:0);
    else if(ws==='spring')v=1.0+1.0*e;else if(ws==='well')v=.55+.3*e;else v=.12;
    give(p,'water',v);if(v<.3)bub(p,'물이 없어…');
  }else if(a==='wood'){give(p,'wood',(.8+1.4*eff(p,'build'))*(w==='폭풍'?.4:1)*(S.tools>0?1.2:1));}
  else if(a==='build'){const e=eff(p,'build');if(S.wood>=1){S.wood-=1;S.shelter=clamp(S.shelter+6+11*e*(S.tools>0?1.25:1),0,100);p.st.built++}else S.shelter=clamp(S.shelter+1.5,0,100);p.contrib+=1}
  else if(a==='signal'){const e=eff(p,'signal');if(S.wood>=1){S.wood-=1;S.signal=clamp(S.signal+8+13*e,0,100)}else S.signal=clamp(S.signal+2.5,0,100);p.st.signal++;p.contrib+=1}
  else if(a==='explore'){
    const e=eff(p,'explore'),h=hidden();p.contrib+=.6;
    if(h.length&&chance(.16+.38*e+p.t.brave*.08)){
      const wts=h.map(z=>z==='spring'?(waterSource()?1:3.2):z==='wreck'?1.4:1);let x=r()*wts.reduce((a,b)=>a+b,0),zz=h[0];
      for(let i=0;i<h.length;i++){x-=wts[i];if(x<=0){zz=h[i];break}}
      discover(zz,p);
    }
    if(chance(.05+(w==='폭풍'?.08:0))){p.inj=ri(2,5);log(`${j(p.name,'이/가')} 탐험 중 비탈에서 굴러 다쳤다.`,'bad');rec(p,'탐험 중에 다쳤다',1)}
  }else if(a==='heal'){
    const sick=isl().filter(x=>x.sick>0&&x!==p);
    for(const s of sick.slice(0,2)){if(chance(.25+p.sk.heal*.6)){s.sick=Math.max(0,s.sick-2);rel(s,p,6);p.st.healed++}}
    if(sick.length){p.contrib+=1;p.healedWho=sick[0]}
  }else if(a==='rest'){p.hp=clamp(p.hp+3,0,100)}
  if(a!=='rest')p.hp=clamp(p.hp-(1.2-p.t.stamina),0,100);
  p.dayContrib+=p.contrib;
}
function discover(z,p){
  if(S.discovered[z])return false;S.discovered[z]=true;const nm=ZONES[z].name;
  const who=p?`${j(p.name,'이/가')} `:'';
  const msg={spring:`${who}바위 틈에서 맑은 물이 솟는 샘을 찾았다. 섬에서 가장 큰 소식이다.`,
    cave:`${who}서늘하고 마른 동굴을 찾았다. 비바람을 피할 수 있을 것 같다.`,
    wreck:`${who}동쪽 암초에 걸린 낡은 화물선 잔해를 찾았다. 안에 뭔가 남아 있을지 모른다.`,
    north:`${who}섬 반대편의 북쪽 해변을 찾았다. 물고기가 많고 수평선이 훤히 보인다.`}[z];
  log(msg,'find');if(p)bub(p,`${nm} 발견!`);
  if(z==='north'){S.fishMax=150;S.stocks.fish+=50}
  if(p){p.st.found.push(nm);rec(p,`${j(nm,'을/를')} 처음 발견했다`,3);for(const o of act())rel(o,p,z==='spring'?8:3);p.mor+=10}
  return true;

/* ---------- 사회 ---------- */
function social(){
  const ps=act();if(ps.length<2)return;
  const k=Math.ceil(ps.length/3);
  for(let i=0;i<k;i++){
    const a=pick(ps),b=pick(ps);if(a===b)continue;
    const near=a.zone===b.zone;
    if(a.stash.food>1.4&&b.sat<45&&(a.t.empathy+a.rel[b.id]/100)>.72){
      const g=Math.min(.8,a.stash.food-1);a.stash.food-=g;b.stash.food+=g;mutual(a,b,10);rel(b,a,6);a.st.shared++;
      log(`${j(a.name,'이/가')} 배고파하는 ${b.name}에게 자기 몫을 덜어 주었다.`,'good');rec(a,`굶주린 ${b.name}에게 먹을 것을 나눴다`,1);bub(a,'이거 먹어');
    }else if(a.sat<45&&a.t.greed>.55&&(b.stash.food>1||b.stash.water>1)&&chance(a.t.greed*.55)){
      const k2=b.stash.food>1?'food':'water';const g=Math.min(1,b.stash[k2]*.5);b.stash[k2]-=g;a.stash[k2]+=g;a.st.stole++;
      const what=k2==='food'?'먹을 것':'물';
      if(chance(.35+(S.watchDays>0?.35:0))){a.st.caught++;rel(b,a,-30);for(const o of ps)if(o!==a&&o!==b&&chance(.4))rel(o,a,-8);S.thieves.push({id:a.id,d:S.day,what});
        log(`${j(a.name,'이/가')} ${b.name}의 ${j(what,'을/를')} 훔치다 들켰다.`,'bad');rec(a,`${b.name}의 ${j(what,'을/를')} 훔치다 들켰다`,3);bub(b,'도둑이야!');
        if(b.t.temper>.6&&chance(.35)){const loser=chance(.5)?a:b;loser.inj=ri(2,4);log(`둘 사이에 몸싸움이 났다. ${j(loser.name,'이/가')} 다쳤다.`,'bad')}
      }else rec(a,`몰래 ${b.name}의 ${j(what,'을/를')} 가져갔다`,2);
    }else if((a.t.temper>.62||a.mor<25)&&chance(.3)){
      mutual(a,b,-ri(6,14));if(chance(.5)){log(`${wa(a)} ${b.name} 사이에 언성이 높아졌다.`,'soc');bub(a,'뭐라고?')}
    }else{
      mutual(a,b,near?ri(3,7):ri(1,4));
      if(chance(.28)){const c=pick(ps);if(c!==a&&c!==b&&a.rel[c.id]<-12){rel(b,c,-6);if(chance(.4))log(`${j(a.name,'이/가')} ${b.name}에게 ${c.name} 험담을 했다.`,'soc')}}
    }
  }
  for(const p of ps){if(p.hyd<22&&chance(.3))bub(p,'목말라…');else if(p.sat<22&&chance(.3))bub(p,'배고파…')}
}
function skim(){
  if(S.rule==='none')return;
  for(const p of act()){
    if(chance(p.t.greed*(1-p.t.coop)*.28*(p.sat<50?1.5:1))){
      const k=S.water>1.5&&p.hyd<p.sat?'water':'food';if(S[k]<1.2)continue;
      S[k]-=.6;p.stash[k]+=.6;p.st.stole++;const what=k==='food'?'공동 식량':'공동 물';
      if(chance(.18+(S.watchDays>0?.4:0)+(S.flags.ledger?.25:0))){
        p.st.caught++;for(const o of act())if(o!==p)rel(o,p,-12);S.thieves.push({id:p.id,d:S.day,what});
        log(`${j(p.name,'이/가')} ${j(what,'을/를')} 몰래 챙기다 들켰다.`,'bad');rec(p,`${j(what,'을/를')} 빼돌리다 들켰다`,3);
      }else{if(k==='water')S.flags.waterMissing=p.id;rec(p,`아무도 모르게 ${j(what,'을/를')} 빼돌렸다`,2)}
    }
  }
}
function support(c){let s=c.t.charisma*2.2;for(const o of act())if(o!==c)s+=Math.max(0,o.rel[c.id])/22;s+=c.st.found.length*.6;return s}
function setLeader(p,how){
  const prev=leader();S.leader=p?p.id:null;S.leaderSince=S.day;
  if(p){S.leaderHist.push({d:S.day,id:p.id,how});rec(p,how==='vote'?'사람들의 선택으로 지도자가 됐다':how==='coup'?'불신임 끝에 지도자 자리를 넘겨받았다':'자연스럽게 섬의 지도자가 됐다',3)}
  if(prev&&prev!==p)rec(prev,'지도자 자리에서 내려왔다',2);
}
function politics(){
  const ps=act();if(ps.length<3)return;
  const L=leader();
  if(!L&&S.day>=2&&S.day>=S.noLeaderUntil){
    const c=best(ps,support);
    if(support(c)>=3.2+ps.length*.18&&chance(.35)){setLeader(c,'natural');log(`누가 정한 것도 아닌데 사람들이 ${c.name}의 말을 따르기 시작했다.`,'pol')}
  }else if(L&&S.day-S.leaderSince>=2){
    const unhappy=ps.filter(o=>o!==L&&o.rel[L.id]<-8).length/(ps.length-1);
    if(unhappy>.45&&chance(.4)){
      const ch=best(ps.filter(o=>o!==L),support);let yes=0;
      for(const v of ps){if(v===L)continue;if(v.rel[L.id]+r()*10<v.rel[ch.id])yes++}
      log(`${j(ch.name,'이/가')} ${L.name}에게 물러나라고 했다. 즉석에서 손을 들어 보기로 했다.`,'pol');
      if(yes>(ps.length-1)/2){setLeader(ch,'coup');log(`${ps.length-1}명 중 ${yes}명이 손을 들었다. ${j(ch.name,'이/가')} 새 지도자가 됐다.`,'pol');rel(L,ch,-30)}
      else{log(`손을 든 사람은 ${yes}명. ${j(L.name,'은/는')} 자리를 지켰다.`,'pol');rel(L,ch,-25)}
    }
  }

function voteScore(v,rule,pr){

function vignettes(){
  const ps=isl(),out=[];const by=a=>ps.filter(p=>p.act===a);
  const fs=by('fish');if(fs.length){const t=best(fs,p=>p.lastGain);if(t.lastGain>.9)out.push(`${j(t.name,'이/가')} 물고기를 ${Math.round(t.lastGain*2.5)}마리 건져 올렸다${fs.length>1?`. 함께 나간 ${fs.length-1}명은 그보다 적었다`:''}.`);else out.push(`${crowd(fs,'이/가')} 바다에 나갔지만 거의 빈손이었다.`)}
  const bd=by('build');if(bd.length)out.push(`${crowd(bd,'이/가')} ${S.flags.cave?'동굴 입구에 바람막이를 쌓았다':'쉼터 지붕에 야자잎을 덧댔다'}.`);
  const wt=by('water');if(wt.length){const ws=waterSource();out.push(rainy()?`${crowd(wt,'이/가')} 빗물을 받아 병마다 채웠다.`:ws==='spring'?`${crowd(wt,'이/가')} 샘까지 오가며 물을 길었다.`:ws?`${crowd(wt,'이/가')} 모래 우물에서 뿌연 물을 떠 왔다.`:`${crowd(wt,'이/가')} 물을 찾아 해변을 헤맸지만 빈손이었다.`)}
  const sg=by('signal');if(sg.length)out.push(`${crowd(sg,'이/가')} 언덕에서 신호불에 젖은 잎을 얹어 연기를 키웠다.`);
  const ex=by('explore');if(ex.length&&!out.some(x=>x.includes('발견')))out.push(`${crowd(ex,'이/가')} 안개 낀 쪽으로 길을 내며 들어갔다.`);
  const pool=shuffle(ps.slice());let n=0;const usedF=new Set();
  for(const p of pool){if(n>=2)break;for(const f of shuffle(AMB.slice())){if(usedF.has(f))continue;const t=f(p);if(t){out.push(t);usedF.add(f);n++;break}}}

}

function distribute(){
  const ps=isl();if(!ps.length)return;
  const needF=S.rationMul,needW=S.waterHalfDay===S.day?.5:1;
  ps.forEach(p=>{p.ateF=0;p.ateW=0});
  const eatStash=(p,k,need)=>{const have=k==='food'?p.ateF:p.ateW;const g=Math.min(Math.max(0,need-have),p.stash[k]);p.stash[k]-=g;if(k==='food')p.ateF+=g;else p.ateW+=g};
  const take=(p,k,a)=>{const g=Math.min(a,S[k]);S[k]-=g;if(k==='food')p.ateF+=g;else p.ateW+=g};
  const comm=ps.filter(p=>!p.exiled);
  if(S.rule==='none'){
    const order=comm.slice().sort((a,b)=>(b.t.greed*.6+b.t.stamina*.4+r()*.3)-(a.t.greed*.6+a.t.stamina*.4+r()*.3));
    for(const p of order){const m=1+p.t.greed*.5;const gf=Math.min(S.food,needF*m*.7);S.food-=gf;p.stash.food+=gf;const gw=Math.min(S.water,needW*m*.7);S.water-=gw;p.stash.water+=gw}
    for(const p of ps){eatStash(p,'food',needF);eatStash(p,'water',needW)}
    for(const h of ps.filter(p=>p.ateF<needF*.5||p.ateW<needW*.5)){
      for(const d of shuffle(comm.filter(p=>p!==h))){
        const k=h.ateW<needW*.5?'water':'food';
        if(d.stash[k]>.6&&(d.t.empathy*.7+d.rel[h.id]/100)>.55){const g=Math.min(.6,d.stash[k]);d.stash[k]-=g;if(k==='food')h.ateF+=g;else h.ateW+=g;rel(h,d,8);d.st.shared++;if(chance(.35))log(`${j(d.name,'이/가')} ${h.name}에게 ${k==='food'?'먹을 것':'물'}을 몰래 건넸다.`,'good');break}
      }
    }
  }else{
    const shares=new Map();let ord=comm.slice();
    if(S.tonight==='weak')ord.sort((a,b)=>a.hp-b.hp);else if(S.tonight==='work')ord.sort((a,b)=>b.dayContrib-a.dayContrib);
    if(S.tonight){let fl=S.food,wl=S.water;for(const p of ord){const f=Math.min(needF,fl);fl-=f;const w2=Math.min(needW,wl);wl-=w2;shares.set(p,[f,w2])}}
    else if(S.rule==='equal'){const pf=Math.min(needF,S.food/comm.length),pw=Math.min(needW,S.water/comm.length);comm.forEach(p=>shares.set(p,[pf,pw]))}
    else if(S.rule==='work'){
      const w=comm.map(p=>p.dayContrib+.25),tw=w.reduce((a,b)=>a+b,0)||1,tf=Math.min(S.food,comm.length*needF*1.1),tW=Math.min(S.water,comm.length*needW*1.1);
      comm.forEach((p,i)=>shares.set(p,[Math.min(needF*1.3,tf*w[i]/tw),Math.min(needW*1.3,tW*w[i]/tw)]));
    }else{
      const L=leader();ord.sort((a,b)=>(b===L?999:L?b.rel[L.id]+L.rel[b.id]:0)-(a===L?999:L?a.rel[L.id]+L.rel[a.id]:0));
      let fl=S.food,wl=S.water;for(const p of ord){const f=Math.min(p===L?needF*1.3:needF,fl);fl-=f;const w2=Math.min(p===L?needW*1.2:needW,wl);wl-=w2;shares.set(p,[f,w2])}
    }
    for(const [p,[f,w]] of shares){if(p.noFood){p.noFood=false;continue}take(p,'food',f);take(p,'water',w)}
    for(const p of ps){eatStash(p,'food',needF);eatStash(p,'water',needW)}
    const L=leader();if(L)for(const p of comm)if(p!==L)rel(p,L,p.ateF>=needF*.8?1.5:-4);
  }
  S.tonight=null;
  if(S.rationDays>0){S.rationDays--;if(!S.rationDays){S.rationMul=1;log('절반 배급이 끝났다.')}}
}
function evening(){
  S.phase=2;

  if(S.fire){if(S.wood>=1)S.wood-=1;else{S.fire=false;log('장작이 떨어져 캠프의 불이 꺼졌다. 날것을 먹어야 한다.','bad')}}

    const x=r();
    if(x<.3&&pr)extra.push(`${wa(pr[0])} ${j(pr[1].name,'이/가')} 불 옆에서 늦게까지 이야기를 나눴다.`);
    else if(x<.45)extra.push('누군가 집에 두고 온 강아지 이야기를 꺼내자 다들 조용해졌다.');
    else if(x<.6){const s=best(c,p=>p.t.charisma+r()*.4);extra.push(`${j(s.name,'이/가')} 뭍에 나가면 제일 먼저 먹을 음식을 말하자 다들 따라 말했다. 짜장면이 가장 많았다.`)}
    else if(x<.7&&!S.fire)extra.push('불이 없어 다들 서로 등을 맞대고 앉았다.');
    else if(x<.82){const p=pick(c);extra.push(`${j(p.name,'은/는')} 밥 대신 별자리를 세다 잠들었다.`)}
    else if(leader()){extra.push(`${j(leader().name,'이/가')} 내일 할 일을 정했다. ${c.filter(p=>p.rel[leader().id]<0).length}명은 듣지 않았다.`)}
  }
  extra.forEach(life);

  }

  if(!S.fire)for(const p of isl())if(!p.sick&&chance(.03))p.sick=ri(2,4);

function eventPool(slots){return EV.filter(e=>(!e.ph||e.ph.some(x=>slots.includes(x)))&&!(e.once&&S.evLast[e.id]!=null)&&(S.evLast[e.id]==null||S.day-S.evLast[e.id]>=4)&&safe(e.cond))}
function safe(f){try{return !!f()}catch(e){return false}}
function makeInst(e,slots){const ctx=e.setup?e.setup():{};if(ctx===null||ctx===undefined)return null;const opts=e.opts(ctx);if(!opts||opts.length<2)return null;return{e,ctx,k:e.k,title:e.title(ctx),text:e.text(ctx),opts:opts.map(o=>({l:o.l,h:o.h,run:o.run})),day:S.day,ph:(e.ph||slots).filter(x=>slots.includes(x)).pop()}}
function maybeEvent(ph){
  if(act().length<2)return null;
  const slots=ph===0?[0,1]:ph===1?[1,2]:ph===3?[3,0]:[];if(!slots.length)return null;
  const pool=eventPool(slots);
  const forced=pool.filter(e=>e.force);
  if(forced.length){const i=makeInst(forced[0],slots);if(i){S.evLast[forced[0].id]=S.day;return i}}
  if(S.evCool>0){S.evCool--;return null}
  if(!chance(.27))return null;
  const tmp=pool.slice();
  while(tmp.length){
    const ws=tmp.map(e=>e.w?Math.max(.05,e.w()):1);let x=r()*ws.reduce((a,b)=>a+b,0),k=0;for(;k<tmp.length;k++){x-=ws[k];if(x<=0)break}k=Math.min(k,tmp.length-1);
    const e=tmp.splice(k,1)[0];const inst=makeInst(e,slots);if(inst){S.evLast[e.id]=S.day;S.evCool=3;return inst}
  }
  return null;
}

}

  $('aliveCount').textContent=`${S.people.filter(p=>p.alive).length}명 생존`;
  $('roster').innerHTML=ps.map(p=>`<button class="prow${p.alive?'':' dead'}" data-id="${p.id}" aria-current="${sel===p.id}">
    <div style="min-width:0"><div class="nm"><strong><i class="dot" style="background:${SHIRT[p.id]}"></i>${p.name}</strong><span>${p.job}</span>${statusTags(p)}</div>
    <div class="doing">${p.alive&&!p.away?`${C.ZONES[p.zone].name} · ${C.ACTS[p.act]}`:p.away?'바다 위':'—'}</div></div>
    <div class="bars"><div class="bar hp"><i style="width:${p.alive?p.hp:0}%"></i></div><div class="bar sat"><i style="width:${p.alive?p.sat:0}%"></i></div><div class="bar hyd"><i style="width:${p.alive?p.hyd:0}%"></i></div></div></button>`).join('');
}
$('roster').addEventListener('click',e=>{const b=e.target.closest('.prow');if(!b)return;sel=+b.dataset.id;renderSide()});
function traitWords(p){const t=p.t,w=[t.coop>.65?'협조적':t.coop<.3?'제멋대로':null,t.greed>.65?'욕심 많음':t.greed<.25?'욕심 없음':null,t.brave>.65?'용감함':t.brave<.25?'겁 많음':null,t.charisma>.65?'사람을 끄는 힘':null,t.temper>.65?'다혈질':t.temper<.2?'차분함':null,t.empathy>.68?'정이 많음':t.empathy<.25?'냉정함':null,t.stamina>.8?'체력 좋음':t.stamina<.45?'체력 약함':null];return w.filter(Boolean)}
function renderDetail(){
  const S=C.S,p=S.people[sel],fr=C.friendOf(p);
  const recs=p.rec.slice(-10).reverse().map(x=>`<li><span>${x.d}일</span>${x.t}</li>`).join('')||'<li class="muted">아직 특별한 일이 없다.</li>';
  const a=C.avgRel(p);
  $('detail').innerHTML=`<div class="who"><h3>${p.name}</h3><span class="muted">${p.job} ${statusTags(p)}</span></div><p class="bio">${p.bio}</p><div class="traits">${traitWords(p).map(x=>`<span class="tag">${x}</span>`).join('')}</div>
   <dl class="kv"><dt>지금</dt><dd>${p.alive&&!p.away?`${C.ZONES[p.zone].name}에서 ${C.ACTS[p.act]}`:p.away?'뗏목을 타고 떠났다':`${p.death.d}일째 ${p.death.cause}`}</dd>
   <dt>체력·포만·수분</dt><dd>${Math.round(p.hp)} · ${Math.round(p.sat)} · ${Math.round(p.hyd)}</dd><dt>사기</dt><dd>${Math.round(p.mor)}</dd>
   <dt>어젯밤 먹은 것</dt><dd>식량 ${f1(p.ateF)} · 물 ${f1(p.ateW)}</dd><dt>개인 비축</dt><dd>식량 ${f1(p.stash.food)} · 물 ${f1(p.stash.water)}</dd>
   <dt>가까운 사람</dt><dd>${fr.b?fr.b.name:'없음'}</dd><dt>불편한 사람</dt><dd>${fr.w?fr.w.name:'없음'}</dd>
   <dt>평판</dt><dd>${a>15?'믿음직하다':a>3?'괜찮다':a>-8?'그저 그렇다':'못 미덥다'}</dd></dl><ul class="reclist">${recs}</ul>`;
}
let lastLog=-1;
function renderJournal(force){
  const S=C.S;if(!force&&S.log.length===lastLog)return;lastLog=S.log.length;
  const out=[];let cur=null;
  for(const e of S.log.slice(-220).reverse()){if(e.k==='day')continue;if(jMode==='big'&&e.k==='life')continue;if(e.d!==cur){cur=e.d;out.push(`<div class="day">${e.d}일째</div>`)}out.push(`<div class="e ${e.k}"><span class="t">${C.PH[e.ph]}</span><span class="m">${e.t}</span></div>`)}
  $('journal').innerHTML=out.join('');
}
$('jAll').onclick=()=>{jMode='all';$('jAll').setAttribute('aria-pressed','true');$('jBig').setAttribute('aria-pressed','false');renderJournal(true)};
$('jBig').onclick=()=>{jMode='big';$('jBig').setAttribute('aria-pressed','true');$('jAll').setAttribute('aria-pressed','false');renderJournal(true)};
function renderSide(){renderTop();renderRoster();renderDetail();renderJournal()}

function syncPlay(){$('play').textContent=running?'일시정지':'재생';$('play').setAttribute('aria-pressed',String(!running))}
let cur=null;
function step(){
  const ev=C.tick();renderSide();if(C.S.ended)clearSave();else if(!ev)saveGame();
  if(C.S.ended){setTimeout(openEnding,900);modal=true;return}
  if(ev)setTimeout(()=>openEvent(ev),speed===10?250:700),modal=true;
}
function openEvent(ev){
  const S=C.S;cur=ev;modal=true;
  $('evEb').textContent=`${ev.day}일째 ${C.PH[ev.ph]} · ${ev.k}`;$('evTitle').textContent=ev.title;$('evText').textContent=ev.text;
  const fc=C.forecast();$('evStatus').textContent=`생존 ${S.people.filter(p=>p.alive&&!p.away).length}명 · 식량 ${f1(S.food)} · 물 ${f1(S.water)} · 장작 ${f1(S.wood)}${fc?' · '+fc:''}`;
  $('evOpts').innerHTML=ev.opts.map((o,i)=>`<button class="opt" data-i="${i}"><b>${o.l}</b><span>${o.h||''}</span></button>`).join('');
  $('ovEvent').hidden=false;$('evOpts').querySelector('.opt')?.focus();
}
$('evOpts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)choose(+b.dataset.i,false)});
$('autoPick').onclick=()=>choose(Math.floor(Math.random()*cur.opts.length),true);
let sceneTimer=null,lines=[],li=0;
function choose(i,auto){
  $('ovEvent').hidden=true;const o=cur.opts[i];lines=C.resolve(cur,i,auto);if(C.S.ended)clearSave();else saveGame();
  $('sceneEb').textContent=`${cur.title}${auto?' · 섬 사람들이 정함':''}`;$('sceneTitle').textContent=o.l;
  li=0;$('scene').innerHTML='';$('sceneDone').hidden=true;$('sceneSkip').hidden=false;$('ovScene').hidden=false;renderSide();nextLine();
}
function addLine(t){const p=document.createElement('p');const hl=t.startsWith('※');p.textContent=hl?t.slice(1).trim():t;if(hl)p.className='hl';$('scene').appendChild(p)}
function nextLine(){clearTimeout(sceneTimer);if(li>=lines.length){$('sceneDone').hidden=false;$('sceneSkip').hidden=true;$('sceneDone').textContent=C.S.ended?'끝을 본다':'섬으로 돌아간다';$('sceneDone').focus();return}addLine(lines[li++]);sceneTimer=setTimeout(nextLine,speed===10?260:speed===3?550:900)}
$('sceneSkip').onclick=()=>{clearTimeout(sceneTimer);while(li<lines.length)addLine(lines[li++]);nextLine()};
$('sceneDone').onclick=()=>{$('ovScene').hidden=true;acc=0;renderSide();if(C.S.ended){openEnding();return}modal=false};
let slides=[],si=0;
function openEnding(){slides=C.endingSlides();si=0;$('ovEnd').hidden=false;modal=true;renderSlide()}
function renderSlide(){
  const s=slides[si];$('endEb').textContent=s.eb;$('endTitle').textContent=s.title;const b=$('endBody');b.innerHTML='';
  if(s.p){const d=document.createElement('div');d.className='portrait';d.innerHTML=`<span class="fate ${s.p.alive?'alive':'dead'}">${s.p.alive?(s.p.away?'구조를 부른 사람':'생존'):'사망'}</span><span class="muted">${s.p.job}</span>`;b.appendChild(d)}
  for(const t of s.body){const p=document.createElement('p');p.style.whiteSpace='pre-line';p.textContent=t;b.appendChild(p)}
  $('endDots').innerHTML=slides.map((_,i)=>`<i class="${i===si?'on':''}"></i>`).join('');
  $('endPrev').disabled=si===0;$('endNext').textContent=si===slides.length-1?'닫기':'다음';
}
$('endPrev').onclick=()=>{if(si>0){si--;renderSlide()}};
$('endNext').onclick=()=>{if(si<slides.length-1){si++;renderSlide()}else $('ovEnd').hidden=true};
$('endNew').onclick=()=>{$('ovEnd').hidden=true;start()};
$('play').onclick=()=>{running=!running;syncPlay()};
for(const v of[1,3,10])$('sp'+v).onclick=()=>{speed=v;for(const u of[1,3,10])$('sp'+u).setAttribute('aria-pressed',String(u===v))};
$('reset').onclick=()=>{['ovEvent','ovScene','ovEnd'].forEach(id=>$(id).hidden=true);clearTimeout(sceneTimer);start()};
function resumeToast(msg){try{const d=document.createElement('div');d.setAttribute('role','status');d.textContent=msg;
 d.style.cssText='position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:2147483001;max-width:min(92vw,520px);background:rgba(22,25,40,.9);color:#eef0f8;font:600 13px/1.45 "IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;padding:9px 14px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);text-align:center;transition:opacity .4s';
 document.body.appendChild(d);setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),450)},5200)}catch(e){}}
const SAVE_KEY='castaway-island-v1';
function saveGame(){try{if(C.S&&!C.S.ended)localStorage.setItem(SAVE_KEY,JSON.stringify(C.S))}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function resumeGame(){let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){}
 if(!s||s.ended||!Array.isArray(s.people)||!s.people.length||typeof s.seed!=='number')return false;
 try{C.load(s);genTerrain(s.seed);modal=false;acc=0;lastLog=-1;sel=0;bubbles.clear();running=true;syncPlay();renderSide()}catch(e){clearSave();return false}
 resumeToast(`${s.day}일째 ${C.PH[s.phase]||''}부터 이어서 합니다 · 처음부터 하려면 ‘새 섬’`);return true}
function start(){const seed=1000+Math.floor(Math.random()*9000);C.newGame(seed);saveGame();genTerrain(seed);modal=false;acc=0;lastLog=-1;sel=0;bubbles.clear();running=true;syncPlay();renderSide()}
let last=performance.now();
function loop(now){const dt=Math.min(100,now-last);last=now;if(running&&!modal&&!C.S.ended){acc+=dt;if(acc>=PHMS[speed]){acc=0;step()}}draw(now);requestAnimationFrame(loop)}
window.addEventListener('resize',resize);
resize();if(!resumeGame())start();requestAnimationFrame(loop);
})();
</script>

</body></html>
