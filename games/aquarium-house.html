header.top{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

<div class="app">
  <header class="top">
    <h1>어항 하우스<small>디자이너 AI가 혼자 집을 꾸밉니다. 지켜보다가 지령을 내리고, 좋아·별로로 가르치세요.</small></h1>

  </header>

  <div class="left">
    <div class="stage" id="stage">
      <canvas id="c" aria-label="집 관찰창"></canvas>
      <div class="hud tl"><span class="pill clock" id="clock">1일차 08:00</span></div>
      <div class="hud tr">
        <div class="seg" role="group" aria-label="시간 속도">
          <button id="sp0" aria-pressed="false">정지</button>
          <button id="sp1" aria-pressed="true">1×</button>
          <button id="sp3" aria-pressed="false">4×</button>
        </div>
      </div>
      <div class="hud br">
        <div class="seg" role="group" aria-label="확대">
          <button id="zOut" aria-label="축소">−</button>
          <button id="zIn" aria-label="확대">＋</button>
        </div>
      </div>
      <div class="card" id="card" hidden>
        <div><div class="nm" id="cardName"></div><div class="meta" id="cardMeta"></div></div>
        <div class="row">
          <button class="btn primary" id="cardLike">좋아</button>
          <button class="btn warn" id="cardNo">별로, 치워줘</button>
          <button class="btn" id="cardClose">닫기</button>
        </div>
      </div>
    </div>

    <form class="cmd" id="cmdForm" autocomplete="off">
      <input id="cmd" type="text" maxlength="200" placeholder="지령: 예) 거실을 식물로 가득 채워줘">
      <button class="btn primary" id="cmdBtn" type="submit">지령</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabLog" aria-selected="true">관찰 일지</button>
      <button class="tab" role="tab" id="tabLearn" aria-selected="false">학습 노트</button>
    </div>
    <div class="pane" id="paneLog"><ul class="log" id="log"></ul></div>
    <div class="pane" id="paneLearn" hidden>
      <div class="sec"><div class="stats" id="stats"></div></div>
      <div class="sec"><h3>취향 일치도 추이</h3><svg class="spark" id="spark" viewBox="0 0 300 46" preserveAspectRatio="none"></svg></div>
      <div class="sec"><h3>스타일 선호</h3><div id="styleBars"></div></div>
      <div class="sec"><h3>요소 선호</h3><div id="tagBars"></div></div>
      <div class="sec"><h3>배운 것</h3><ol class="lessons" id="lessons"></ol></div>
      <div class="foot"><span id="saveTxt">저장 위치 확인 중</span><button class="btn warn" id="resetBtn" type="button">새 집에서 다시 시작</button></div>
    </div>
  </section>
</div>

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function freshState(){

    lessons:[],log:[],fbHist:[],agree:[],stats:{likes:0,dislikes:0,cmds:0,acts:0},directives:[],fav,dayFb:{l:0,d:0},savedAt:0};
  SK.forEach(k=>s.taste.styles[k]=0);TK.forEach(k=>s.taste.tags[k]=0);
  s.taste.styles[fav]=0.3;
  RK.forEach(k=>s.rooms[k]={style:'farmhouse'});

const cv=document.getElementById('c'),ctx=cv.getContext('2d'),stageEl=document.getElementById('stage');
let CW=0,CH=0,DPR=1,TW=24,ZH=14,OX=0,OY=0,zoom=1.15,panX=0,panY=0;
function resize(){
  const w=stageEl.clientWidth;const h=Math.round(Math.min(w/1.22,window.innerHeight*0.62,640));
  DPR=Math.min(window.devicePixelRatio||1,2);CW=w;CH=h;
  cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.height=h+'px';
}
window.addEventListener('resize',resize);
function layout(){
  const base=Math.min(CW/((LW+LH)/2),CH/((LW+LH)/4+1.3))*0.98;
  TW=base*zoom;ZH=TW*0.6;
  const cx=HX+HW/2,cy=HY+HH/2;
  OX=CW/2+panX-(cx-cy)*TW/2;OY=CH/2+panY-(cx+cy)*TW/4+0.5*ZH;
}
const P=(x,y,z)=>[OX+(x-y)*TW/2,OY+(x+y)*TW/4-(z||0)*ZH];
const shadeCache=new Map();
function shade(hex,f){const k=hex+f;let v=shadeCache.get(k);if(v)return v;
  const n=parseInt(hex.slice(1,7),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(f<1){r*=f;g*=f;b*=f}else{r+=(255-r)*(f-1);g+=(255-g)*(f-1);b+=(255-b)*(f-1)}
  v=`rgb(${r|0},${g|0},${b|0})`;shadeCache.set(k,v);return v}
function mix(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const f=(s)=>[(s>>16)&255,(s>>8)&255,s&255];const x=f(A),y=f(B);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function poly(pts,fill,stroke){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=0.6;ctx.stroke()}}
function box(x,y,z,w,d,h,col){
  const a=P(x,y+d,z),b=P(x+w,y+d,z),c=P(x+w,y,z),at=P(x,y+d,z+h),bt=P(x+w,y+d,z+h),ct=P(x+w,y,z+h),dt=P(x,y,z+h);
  const st='rgba(0,0,0,0.13)';
  if(h>0.02){poly([a,b,bt,at],shade(col,0.84),st);poly([b,c,ct,bt],shade(col,0.68),st)}
  poly([dt,ct,bt,at],col,st);
}
function foliage(x,y,z,r){
  const g=['#3f7d3f','#4f9447','#6aa84f','#3a6e3a'];
  const offs=[[-.12,-.05,0],[.12,-.04,.02],[0,.1,.05],[-.05,-.1,.18],[.07,.06,.2],[0,0,.32]];
  offs.forEach((o,i)=>{const p=P(x+o[0],y+o[1],z+o[2]);ctx.beginPath();ctx.arc(p[0],p[1],r*TW*(i===5?0.5:0.62),0,Math.PI*2);ctx.fillStyle=g[i%4];ctx.fill()});
}
function drawItem(it){
  const t=TYPES[it.type],pal=STYLES[it.style].p;
  const parts=t.parts.map(p=>{if(p[0]==='leaf'){let[_,cx,cy,z,r]=p;if(it.rot)[cx,cy]=[cy,cx];return{leaf:1,cx,cy,z,r,k:cx+cy,dz:z}}
    let[dx,dy,dz,w,d,h,c]=p;if(it.rot){[dx,dy]=[dy,dx];[w,d]=[d,w]}return{dx,dy,dz,w,d,h,c,k:dx+dy+(w+d)/2}});
  parts.sort((a,b)=>(a.dz-b.dz)||(a.k-b.k));
  const bx=HX+it.x,by=HY+it.y;
  for(const p of parts){if(p.leaf){foliage(bx+p.cx,by+p.cy,p.z,p.r);continue}
    const col=p.c[0]==='#'?p.c:pal[p.c];box(bx+p.dx,by+p.dy,p.dz,p.w,p.d,p.h,col)}
  if(it===selected){const fw=it.rot?t.d:t.w,fd=it.rot?t.w:t.d;const pts=[P(bx,by,0),P(bx+fw,by,0),P(bx+fw,by+fd,0),P(bx,by+fd,0)];ctx.save();ctx.setLineDash([4,3]);poly(pts,'rgba(255,255,255,0)', '#ffffff');ctx.strokeStyle=css.lawn;ctx.lineWidth=2;ctx.stroke();ctx.restore()}
}
const fp=it=>{const t=TYPES[it.type];return it.rot?[t.d,t.w]:[t.w,t.d]};

function drawGround(){
  for(let x=0;x<LW;x++)for(let y=0;y<LH;y++){
    const inHouse=x>=HX&&x<HX+HW&&y>=HY&&y<HY+HH;if(inHouse)continue;
    let col=((x+y)%2)?'#6fae5a':'#67a554';
    if(x===HX+3&&y>=HY+HH)col=((y)%2)?'#cfc8b8':'#c6bfae';
    if(x>=HX+HW-1&&x<=HX+HW&&y>=HY+HH)col='#a9abad';
    poly([P(x,y,0),P(x+1,y,0),P(x+1,y+1,0),P(x,y+1,0)],col);
  }
  // 집 바닥
  for(let x=0;x<HW;x++)for(let y=0;y<HH;y++){
    const r=roomAt(x,y);let f=STYLES[S.rooms[r].style].p.floor;
    if(r==='bath')f=mix(f,'#e4ecee',0.72);
    const c=((x+y)%2)?shade(f,0.96):f;
    poly([P(HX+x,HY+y,0),P(HX+x+1,HY+y,0),P(HX+x+1,HY+y+1,0),P(HX+x,HY+y+1,0)],c,'rgba(0,0,0,0.05)');
  }
}
function wallCol(r){return STYLES[S.rooms[r].style].p.wall}
const WH=1.7;
function drawBackWalls(night){
  // x=0 벽 (y 방향), y=0 벽 (x 방향)
  for(let j=HH-1;j>=0;j--){const r=roomAt(0,j);box(HX-0.12,HY+j,0,0.12,1,WH,wallCol(r));
    if(j%3===1){const q=[P(HX,HY+j+0.25,0.6),P(HX,HY+j+0.75,0.6),P(HX,HY+j+0.75,1.3),P(HX,HY+j+0.25,1.3)];poly(q,night?'#f3d58a':'#bcdbe6','rgba(0,0,0,0.25)')}}
  box(HX-0.12,HY-0.12,0,0.12,0.12,WH,wallCol('bedroom'));
  for(let i=0;i<HW;i++){const r=roomAt(i,0);box(HX+i,HY-0.12,0,1,0.12,WH,wallCol(r));
    if(i%3===1){const q=[P(HX+i+0.25,HY,0.6),P(HX+i+0.75,HY,0.6),P(HX+i+0.75,HY,1.3),P(HX+i+0.25,HY,1.3)];poly(q,night?'#f3d58a':'#bcdbe6','rgba(0,0,0,0.25)')}}
}
function wallObjs(list){
  const lowH=0.34,frontH=0.42,th=0.12;
  const push=(x,y,w,d,h,col)=>list.push({k:x+y+(w+d)/2,draw:()=>box(x,y,0,w,d,h,col)});
  // 칸막이 y=4
  for(let i=0;i<HW;i++){if(i===2||i===7||i===10)continue;push(HX+i,HY+4-th/2,1,th,lowH,wallCol(roomAt(i,4)))}
  for(let j=0;j<4;j++){push(HX+6-th/2,HY+j,th,1,lowH,wallCol('bath'));push(HX+9-th/2,HY+j,th,1,lowH,wallCol('study'))}
  for(let j=4;j<HH;j++){if(j===7)continue;push(HX+7-th/2,HY+j,th,1,lowH,wallCol('kitchen'))}
  // 앞쪽 외벽
  for(let i=0;i<HW;i++){if(i===3)continue;push(HX+i,HY+HH,1,th,frontH,wallCol(roomAt(i,HH-1)))}

function decorObjs(list){
  TREES.forEach(([x,y])=>list.push({k:x+y,draw:()=>{box(x-0.08,y-0.08,0,0.16,0.16,0.9,'#7a5634');

const PEOPLE=[
  {name:'에밀리',x:3,y:6,tx:3,ty:6,shirt:'#d36b5a',hair:'#3b2a20',skin:'#f0c9a8',say:'',until:0},

  {name:'버디',dog:1,x:5,y:8,tx:5,ty:8,shirt:'#b98552',say:'',until:0},
];
function occMap(){const m=new Map();for(const it of S.items){const[fw,fd]=fp(it);for(let i=0;i<fw;i++)for(let j=0;j<fd;j++){const key=(it.x+i)+','+(it.y+j);if(TYPES[it.type].flat){if(!m.has(key))m.set(key,null)}else m.set(key,it)}}return m}
function freeTiles(){const m=occMap(),out=[];for(let x=0;x<HW;x++)for(let y=0;y<HH;y++){if(!m.get(x+','+y))out.push([x,y])}return out}
function stepPeople(dt){
  const sp=dt*0.9;
  for(const p of PEOPLE){const dx=p.tx-p.x,dy=p.ty-p.y,dist=Math.hypot(dx,dy);
    if(dist<0.05){if(rnd()<dt*0.35){if(p.dog&&rnd()<0.6){const o=PEOPLE[rnd()<0.5?0:1];p.tx=clamp(o.x+0.6,0.3,HW-0.3);p.ty=clamp(o.y+0.4,0.3,HH-0.3)}else{const f=freeTiles();if(f.length){const t=pick(f);p.tx=t[0]+0.5;p.ty=t[1]+0.5}}}}
    else{const s=Math.min(dist,sp*(p.dog?1.3:1));if(Math.abs(dx)>0.04)p.x+=Math.sign(dx)*Math.min(Math.abs(dx),s);else p.y+=Math.sign(dy)*Math.min(Math.abs(dy),s)}}
}
function personObjs(list,now){
  for(const p of PEOPLE){const x=HX+p.x,y=HY+p.y;list.push({k:x+y+0.1,draw:()=>{
    const sh=P(x,y,0);ctx.beginPath();ctx.ellipse(sh[0],sh[1],TW*0.16,TW*0.08,0,0,7);ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fill();
    if(p.dog){box(x-0.17,y-0.08,0.12,0.34,0.16,0.14,p.shirt);box(x+0.12,y-0.07,0.2,0.14,0.14,0.14,shade(p.shirt,0.9));}
    else{box(x-0.1,y-0.08,0,0.2,0.16,0.36,'#3b4552');box(x-0.13,y-0.1,0.36,0.26,0.2,0.36,p.shirt);
      const hp=P(x,y,0.86);ctx.beginPath();ctx.arc(hp[0],hp[1],TW*0.12,0,7);ctx.fillStyle=p.skin;ctx.fill();
      ctx.beginPath();ctx.arc(hp[0],hp[1]-TW*0.04,TW*0.12,Math.PI,0);ctx.fillStyle=p.hair;ctx.fill();}
    if(p.say&&now<p.until)bubble(P(x,y,p.dog?0.6:1.15),p.name+': '+p.say);
  }})}

function bubble(pt,text){

  let bx=clamp(pt[0]-w/2,6,CW-w-6),by=pt[1]-30;

let pops=[];
function addPop(it,text){pops.push({x:HX+it.x+0.5,y:HY+it.y+0.5,text,born:performance.now()})}

function nightF(){const h=S.min/60;if(h<5||h>=21.5)return 1;if(h<7)return 1-(h-5)/2;if(h>=18.5)return (h-18.5)/3;return 0}
let selected=null;
function draw(now){

  ctx.fillStyle=css.stage;ctx.fillRect(0,0,CW,CH);
  const nf=nightF();

    ctx.globalCompositeOperation='lighter';

      const r=TW*(t.light>1?2.6:1.6);const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],r);g.addColorStop(0,`rgba(255,196,110,${0.55*nf})`);g.addColorStop(1,'rgba(255,196,110,0)');ctx.fillStyle=g;ctx.fillRect(p[0]-r,p[1]-r,r*2,r*2)}

// ---------- AI 두뇌 (기본 학습기) ----------
const T=S=>S.taste;
function countIn(room,type){return S.items.filter(i=>i.room===room&&i.type===type).length}
function occupancy(room){const r=ROOMS[room];let a=0;for(const it of S.items)if(it.room===room&&!TYPES[it.type].flat){const[fw,fd]=fp(it);a+=fw*fd}return a/(r.w*r.h)}
function prefFill(){return clamp(0.4-0.22*S.taste.tags.minimal,0.18,0.6)}
function tagSum(type){return TYPES[type].tags.reduce((s,t)=>s+(S.taste.tags[t]||0),0)}
function topStyle(){return SK.slice().sort((a,b)=>S.taste.styles[b]-S.taste.styles[a])[0]}
function sampleStyle(room){const w=SK.map(k=>Math.exp((S.taste.styles[k]+(room&&S.rooms[room].style===k?0.12:0))*4));const sum=w.reduce((a,b)=>a+b);let r=rnd()*sum;for(let i=0;i<SK.length;i++){r-=w[i];if(r<=0)return SK[i]}return SK[0]}
function activeDirs(){return S.directives.filter(d=>d.hours>0)}
function findSpot(room,type){
  const r=ROOMS[room],t=TYPES[type],m=occMap(),cands=[];
  for(const rot of (t.w===t.d?[0,1]:[0,1])){
    const fw=rot?t.d:t.w,fd=rot?t.w:t.d;
    for(let x=r.x;x<=r.x+r.w-fw;x++)for(let y=r.y;y<=r.y+r.h-fd;y++){
      if(t.wall){if(rot===0&&y!==r.y)continue;if(rot===1&&x!==r.x)continue}
      let ok=true;
      for(let i=0;i<fw&&ok;i++)for(let j=0;j<fd&&ok;j++){const key=(x+i)+','+(y+j);
        if(t.flat){if(m.has(key)&&m.get(key)===null)ok=false}else{if(m.get(key))ok=false;if(KEEP.has(key))ok=false}}
      if(!ok)continue;
      let sc=rnd();
      if(!t.wall){const cx=r.x+r.w/2-fw/2,cy=r.y+r.h/2-fd/2;sc+=(t.flat?2:0.6)-Math.hypot(x-cx,y-cy)*(t.flat?0.6:0.15)}
      cands.push({x,y,rot,sc});
    }
  }
  if(!cands.length)return null;cands.sort((a,b)=>b.sc-a.sc);return cands[0];
}
function placeItem(type,room,style){
  const sp=findSpot(room,type);if(!sp)return null;

      else{sc=0.15+tagSum(type)*1.3+(S.taste.types[type]||0)*1.6+rnd()*0.8;why='';
        if(occ+TYPES[type].w*TYPES[type].d/(r.w*r.h)>pref)sc-=2.4;
        const types=S.taste.types[type]||0,ts=tagSum(type);
        if(ts>0.25)why=`요즘 ${TYPES[type].tags.map(t=>TAGS[t]).join('·')} 쪽이 좋다고 배워서`;else if(types>0.2)why=`${TYPES[type].n} 좋아하시는 것 같아서`;}
      let dsty=null;
      for(const d of dRoom){if(d.neg)continue;const hit=(d.tags||[]).some(t=>TYPES[type].tags.includes(t))||(d.types||[]).includes(type);if(hit){sc+=2.4;why=`지령 “${d.text}” 따라`}if(d.style)dsty=d.style}
      for(const d of dRoom){if(!d.neg)continue;const hit=(d.tags||[]).some(t=>TYPES[type].tags.includes(t))||(d.types||[]).includes(type);if(hit)sc-=4}
      c.push({op:'place',type,room,style:dsty||sampleStyle(room),sc,why});
    }

    const rs=S.rooms[room].style;let tgt=topStyle(),gap=S.taste.styles[tgt]-S.taste.styles[rs];
    const dStyle=dRoom.find(d=>d.style&&!d.neg);if(dStyle&&dStyle.style!==rs){tgt=dStyle.style;gap=Math.max(gap,0.8)}
    if(tgt!==rs&&gap>0.3)c.push({op:'room',room,style:tgt,sc:gap*1.6+rnd()*0.4-0.2,why:dStyle?`지령 “${dStyle.text}” 따라`:`${STYLES[tgt].n} 쪽을 더 좋아하셔서`});
  }
  for(const it of S.items){
    const r=ROOMS[it.room],ess=(r.ess[it.type]||0)>=countIn(it.room,it.type);
    const dRoom=dirs.filter(d=>!d.room||d.room===it.room);
    let tgt=topStyle(),gap=S.taste.styles[tgt]-S.taste.styles[it.style];
    const dStyle=dRoom.find(d=>d.style&&!d.neg);if(dStyle&&dStyle.style!==it.style){tgt=dStyle.style;gap=Math.max(gap,0.75)}
    if(tgt!==it.style&&gap>0.3)c.push({op:'restyle',it,style:tgt,sc:gap*1.8+rnd()*0.5-0.1,why:dStyle?`지령 “${dStyle.text}” 따라`:`${STYLES[it.style].n}보다 ${STYLES[tgt].n} 반응이 좋아서`});
    if(!ess){const occ=occupancy(it.room);let sc=-0.9+rnd()*0.4+Math.max(0,occ-prefFill())*7-(S.taste.types[it.type]||0)*1.5-tagSum(it.type);let why=occ>prefFill()?`${r.n}이 좀 답답해 보여서`:'별로 안 좋아하시는 것 같아서';
      for(const d of dRoom){if(d.neg&&(((d.tags||[]).some(t=>TYPES[it.type].tags.includes(t)))||(d.types||[]).includes(it.type)||(d.tags||[]).includes('minimal'))){sc+=3;why=`지령 “${d.text}” 따라`}}

}

function learn(act,sign,source){
  const s=S.taste,k=sign>0?1:1.2;

  if(act.type){s.types[act.type]=clamp((s.types[act.type]||0)+0.2*sign*k,-1,1);
    TYPES[act.type].tags.forEach(t=>s.tags[t]=clamp(s.tags[t]+0.08*sign*k,-1,1))}
  S.fbHist.push(sign>0?1:0);if(S.fbHist.length>30)S.fbHist.shift();
  if(sign>0){S.stats.likes++;S.dayFb.l++}else{S.stats.dislikes++;S.dayFb.d++}
  const what=act.type?`${STYLES[act.style].n} ${TYPES[act.type].n}`:`${STYLES[act.style].n} 톤`;
  if(rnd()<0.6||sign<0)addLesson(sign>0?`${what} → 좋아하심. 비슷한 걸 더 시도할 것.`:`${what} → 별로라고 하심. 당분간 피할 것.`);

function localParse(text){

  else types.forEach(t=>{const rr=(room&&ROOMS[room].types.includes(t))?room:RK.find(k=>ROOMS[k].types.includes(t));if(rr)out.actions.push({op:'place',type:t,room:rr,style:styles[0]||topStyle()})});

];
const EVENTS=[
  ()=>{const t=pick(['armchair','lamp','plant','bookshelf','rug']),s=pick(SK);const r=RK.find(k=>ROOMS[k].types.includes(t)&&countIn(k,t)<MAXC[t]&&findSpot(k,t));if(!r)return;
    const it=placeItem(t,r,s);if(it){addPop(it,'📦 '+describe(it));addLog('event',`옆집 밀러 부인이 쓰던 ${describe(it)}을(를) 놓고 갔어요. ${ROOMS[r].n}에 두었어요.`,{act:{itemId:it.id,type:t,style:s},fb:0})}},
  ()=>{if(!S.items.length)return;const it=pick(S.items);addLog('event',`${ROOMS[it.room].n} ${TYPES[it.type].n}이(가) 낡아 보인다는 말이 나왔어요.`);S.directives.push({text:`${TYPES[it.type].n} 교체`,room:it.room,tags:[],types:[it.type],style:null,neg:false,hours:4});const tgt=topStyle();if(tgt!==it.style){it.style=tgt;addPop(it,'↻ '+STYLES[tgt].n);addLog('ai',`${TYPES[it.type].n}, ${STYLES[tgt].n}로 새로 바꿨어요.`,{act:{itemId:it.id,type:it.type,style:tgt},fb:0});dirty()}},
  ()=>{addLog('event','쌀쌀해졌어요. 다들 담요를 찾네요.');S.taste.tags.cozy=clamp(S.taste.tags.cozy+0.05,-1,1)},
  ()=>{addLog('event','주말 홈파티 예정. 손님이 온대요.');S.directives.push({text:'손님맞이',room:'living',tags:['cozy','light'],types:['armchair'],style:null,neg:false,hours:8})},
];
function hourTick(h){
  S.directives.forEach(d=>d.hours--);S.directives=S.directives.filter(d=>d.hours>0);
  if(h>=8&&h<=22)aiTick();
  if(h>=7&&h<=23&&rnd()<0.33){const f=pick(REMARKS)();if(f){const p=pick(PEOPLE.filter(p=>!p.dog));p.say=f.t;p.until=performance.now()+4200;addLog('talk',`${p.name}: “${f.t}”`);if(f.dir){S.directives.push(f.dir)}}}
  if(h===10&&rnd()<0.65)pick(EVENTS)();
  if(h===22){const {l,d}=S.dayFb;const ts=topStyle();
    addLesson(`${S.day}일차 회고 — 좋아 ${l}, 별로 ${d}. 지금은 ${STYLES[ts].n} 쪽을 가장 믿고 있어요.`);
    if(S.fbHist.length)S.agree.push({day:S.day,pct:Math.round(100*S.fbHist.reduce((a,b)=>a+b,0)/S.fbHist.length)});if(S.agree.length>60)S.agree.shift();
    S.dayFb={l:0,d:0}}
  dirty();
}
function advance(dt){
  if(!speed)return;const mins=dt*6*speed;const before=S.min;S.min+=mins;
  if(Math.floor(S.min/60)!==Math.floor(before/60)){if(S.min>=1440){S.min-=1440;S.day++;addLog('event',`${S.day}일차 아침이 밝았어요.`)}hourTick(Math.floor(S.min/60))}
}
function updateClock(){const h=Math.floor(S.min/60),m=Math.floor(S.min%60/10)*10;document.getElementById('clock').textContent=`${S.day}일차 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}

// ---------- 화면 패널 ----------
const logEl=document.getElementById('log');
const KIND={ai:'디자이너',you:'나의 지령',event:'사건',talk:'주민'};
let logQueued=false;
function renderLog(){if(logQueued)return;logQueued=true;requestAnimationFrame(()=>{logQueued=false;
  logEl.textContent='';const fbOpen=new Set(S.log.filter(e=>e.act&&!e.fb&&!e.act.removed).slice(0,10).map(e=>e.id));
  for(const e of S.log.slice(0,80)){const li=document.createElement('li');
    const t=document.createElement('div');t.className='t';t.textContent=e.t;li.append(t);
    const body=document.createElement('div');const k=document.createElement('span');k.className='k '+e.kind;k.textContent=KIND[e.kind]||'';body.append(k,document.createTextNode(e.text));
    if(e.why){const w=document.createElement('div');w.className='why';w.textContent=e.why;body.append(w)}
    if(e.act&&!e.act.removed){if(e.fb){const r=document.createElement('div');r.className='rated';r.textContent=e.fb>0?'좋아라고 가르침':'별로라고 가르침';body.append(r)}
      else if(fbOpen.has(e.id)){const fb=document.createElement('div');fb.className='fb';const a=document.createElement('button');a.className='btn primary';a.textContent='좋아';a.onclick=()=>feedback(e,1);
        const b=document.createElement('button');b.className='btn warn';b.textContent='별로';b.onclick=()=>feedback(e,-1);fb.append(a,b);body.append(fb)}}
    li.append(body);logEl.append(li)}
})}
function bars(el,keys,names,obj){el.textContent='';for(const k of keys){const v=obj[k]||0;const row=document.createElement('div');row.className='bar';
  const n=document.createElement('span');n.textContent=names[k];const tr=document.createElement('div');tr.className='track';const f=document.createElement('div');f.className='fill';
  f.style.left=(v>=0?50:50+v*50)+'%';f.style.width=Math.abs(v)*50+'%';f.style.background=v>=0?'var(--lawn)':'var(--flag)';tr.append(f);
  const nm=document.createElement('span');nm.className='num';nm.textContent=(v>0?'+':'')+v.toFixed(2);row.append(n,tr,nm);el.append(row)}}
function renderLearn(){
  const fh=S.fbHist,pct=fh.length?Math.round(100*fh.reduce((a,b)=>a+b,0)/fh.length):null;
  const st=document.getElementById('stats');st.innerHTML='';
  [[pct==null?'—':pct+'%','취향 일치도'],[S.stats.likes+S.stats.dislikes,'피드백 수'],[S.stats.cmds,'지령 수']].forEach(([b,s])=>{const d=document.createElement('div');d.className='stat';const bb=document.createElement('b');bb.textContent=b;const ss=document.createElement('span');ss.textContent=s;d.append(bb,ss);st.append(d)});
  bars(document.getElementById('styleBars'),SK,Object.fromEntries(SK.map(k=>[k,STYLES[k].n])),S.taste.styles);
  bars(document.getElementById('tagBars'),TK,TAGS,S.taste.tags);
  const ol=document.getElementById('lessons');ol.textContent='';
  if(!S.lessons.length){const li=document.createElement('li');li.textContent='아직 배운 게 없어요. 지령을 내리거나 일지에서 좋아·별로를 눌러 주세요.';ol.append(li)}
  for(const l of S.lessons.slice(0,20)){const li=document.createElement('li');const d=document.createElement('span');d.className='d';d.textContent=l.d+' ';li.append(d,document.createTextNode(l.text));ol.append(li)}
  const sv=document.getElementById('spark');const a=S.agree;
  if(a.length<2){sv.innerHTML='<text x="0" y="28" font-size="12" fill="currentColor" opacity=".6">하루가 지날 때마다 기록돼요 (밤 10시 회고)</text>';sv.style.color='var(--muted)'}
  else{const pts=a.map((p,i)=>[i/(a.length-1)*296+2,44-p.pct/100*40]);
    sv.innerHTML=`<line x1="0" x2="300" y1="24" y2="24" stroke="var(--line)" stroke-dasharray="3 3"/><polygon points="2,44 ${pts.map(p=>p.join(',')).join(' ')} 298,44" fill="var(--lawn-soft)"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--lawn)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3" fill="var(--lawn)"/>`}
  document.getElementById('saveTxt').textContent=saveMode;
}

// ---------- 입력 ----------
const card=document.getElementById('card');
function showCard(it){selected=it;document.getElementById('cardName').textContent=describe(it);document.getElementById('cardMeta').textContent=`${ROOMS[it.room].n} · ${it.born}일차에 들어옴`;card.hidden=false}
function hideCard(){selected=null;card.hidden=true}
document.getElementById('cardClose').onclick=hideCard;
document.getElementById('cardLike').onclick=()=>{if(!selected)return;learn({type:selected.type,style:selected.style},1);addLog('you',`${describe(selected)} 좋아.`);addPop(selected,'♥');hideCard()};
document.getElementById('cardNo').onclick=()=>{if(!selected)return;const it=selected;learn({type:it.type,style:it.style},-1);addLog('you',`${describe(it)} 별로.`);addPop(it,'− '+TYPES[it.type].n);removeItem(it);addLog('ai',`치웠어요. ${STYLES[it.style].n} ${TYPES[it.type].n}은 덜 고를게요.`)};
function hit(sx,sy){
  let best=null,bk=-1e9;
  for(const z of [0,0.35,0.7,1.05,1.4]){const a=(sx-OX)/(TW/2),b=(sy-OY+z*ZH)/(TW/4);const wx=(a+b)/2-HX,wy=(b-a)/2-HY;
    for(const it of S.items){const[fw,fd]=fp(it);const t=TYPES[it.type];if(wx>=it.x&&wx<it.x+fw&&wy>=it.y&&wy<it.y+fd&&t.h+0.1>=z){const k=it.x+it.y+(t.flat?-50:0);if(k>bk){bk=k;best=it}}}}
  return best;
}
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;if(drag.moved){panX=clamp(drag.px+dx,-CW*zoom*0.5,CW*zoom*0.5);panY=clamp(drag.py+dy,-CH*zoom*0.5,CH*zoom*0.5)}});
cv.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const r=cv.getBoundingClientRect();const it=hit(e.clientX-r.left,e.clientY-r.top);if(it)showCard(it);else hideCard()}drag=null});
cv.addEventListener('pointercancel',()=>drag=null);
const ZL=[0.85,1.15,1.6,2.2];
document.getElementById('zIn').onclick=()=>{const i=ZL.indexOf(zoom);zoom=ZL[Math.min(ZL.length-1,(i<0?1:i)+1)]};
document.getElementById('zOut').onclick=()=>{const i=ZL.indexOf(zoom);zoom=ZL[Math.max(0,(i<0?1:i)-1)];if(zoom<=1.15){panX=panY=0}};
const spBtns={0:document.getElementById('sp0'),1:document.getElementById('sp1'),4:document.getElementById('sp3')};
for(const k in spBtns)spBtns[k].onclick=()=>{speed=+k;for(const j in spBtns)spBtns[j].setAttribute('aria-pressed',String(+j===speed))};
document.getElementById('cmdForm').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('cmd');const v=i.value;i.value='';command(v)});
const CHIPS=['집 전체를 보헤미안 느낌으로','침실을 좀 밝게','거실 좀 비워줘','피아노 하나 들여놔','식물 많은 게 좋아','빈티지는 싫어'];
const chipsEl=document.getElementById('chips');CHIPS.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chipbtn';b.textContent=c;b.onclick=()=>command(c);chipsEl.append(b)});
const tabs=[['tabLog','paneLog'],['tabLearn','paneLearn']];
tabs.forEach(([t,p])=>document.getElementById(t).onclick=()=>{tabs.forEach(([t2,p2])=>{document.getElementById(t2).setAttribute('aria-selected',String(t2===t));document.getElementById(p2).hidden=t2!==t});if(t==='tabLearn')renderLearn()});
let resetArm=0;const rb=document.getElementById('resetBtn');
rb.onclick=()=>{if(Date.now()-resetArm<4000){S=freshState();hideCard();intro();dirty();saveNow();renderLog();renderLearn();rb.textContent='새 집에서 다시 시작';resetArm=0}else{resetArm=Date.now();rb.textContent='한 번 더 누르면 초기화돼요';setTimeout(()=>{if(Date.now()-resetArm>=3900)rb.textContent='새 집에서 다시 시작'},4000)}};

function intro(){addLog('event',`디자이너 AI가 입주했어요. 원래는 ${STYLES[S.fav].n} 스타일을 좋아하는 편이래요. 지령과 좋아·별로로 당신 취향을 가르쳐 주세요.`)}
if(!local)intro();

// ---------- 루프 ----------
let last=performance.now(),frameN=0;
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(frameN++%90===0)readCss();
  advance(dt);stepPeople(dt*(speed?Math.max(1,speed*0.6):0.3));
  draw(now);updateClock();
  if(isDirty&&now-lastSave>6000)saveNow();
  requestAnimationFrame(frame)}
readCss();resize();renderLog();renderLearn();setBrain();
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden){isDirty=true;saveNow()}});

// ---------- 플랫폼 연결 ----------
(async()=>{
  if(!window.claude||!window.claude.use){document.getElementById('brainTxt').textContent='두뇌: 기본 학습기 (키워드 지령)';return}
  claude.use('sample').then(s=>{sample=s;brainOn=!!s;setBrain()}).catch(()=>{setBrain()});
  try{const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(d&&u){const id=await u.id();if(id){db=d;uid=id;saveMode='계정에 저장 중 (다른 기기에서도 이어서)';
      const snap=await db.doc('data/users/'+uid+'/save').get();
      if(snap.exists){try{const o=JSON.parse(snap.data().json);if(valid(o)&&(o.savedAt||0)>(S.savedAt||0)){S=o;hideCard();renderLog()}}catch(e){}}
      else{isDirty=true;saveNow()}
    }}
  }catch(e){}
  renderLearn();
})();
})();
</script>

</body></html>
