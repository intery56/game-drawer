<style>
/* Layout: 참가자 수첩 — 왼쪽은 나(상태·행동·관찰), 오른쪽은 섬(캔버스·일지). 저녁엔 무작위 미션 시트, 끝나면 내 여정 엔딩 슬라이드 */
:root{

  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --paper:#152023; --ink:#dbe6e7; --muted:#8aa0a5; --line:#283a3e;

  --tag-power:#e0b04a; --tag-vote:#62b6c6; --tag-conflict:#ef6f5c; --tag-bond:#7fc276; --tag-world:#a3a3e0; --tag-leave:#9a9a9a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --paper:#152023; --ink:#dbe6e7; --muted:#8aa0a5; --line:#283a3e;
  --accent:#ee7b50; --cool:#62b6c6; --grid:rgba(98,182,198,.07);
  --tag-power:#e0b04a; --tag-vote:#62b6c6; --tag-conflict:#ef6f5c; --tag-bond:#7fc276; --tag-world:#a3a3e0; --tag-leave:#9a9a9a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.col{display:flex;flex-direction:column;gap:16px;min-width:0}

/* 미션 시트 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,18,20,.55);display:flex;align-items:flex-end;justify-content:center;

/* 미션 진행 */

.ptypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}

.field{display:flex;flex-direction:column;gap:4px}

let rng;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=()=>rng();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=arr=>arr[Math.floor(R()*arr.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hasB=n=>{const c=n.charCodeAt(n.length-1)-44032;return c>=0&&c<11172&&c%28!==0};
const J=(n,j)=>({이:hasB(n)?"이":"가",은:hasB(n)?"은":"는",을:hasB(n)?"을":"를",과:hasB(n)?"과":"와",로:hasB(n)&&(n.charCodeAt(n.length-1)-44032)%28!==8?"으로":"로"}[j]);
const was=n=>n+(hasB(n)?"이었다":"였다");
function fill(tpl,map){return tpl.replace(/\{([a-z]+)(이|은|을|과|로)?\}/g,(m,k,j)=>{const v=map[k];if(v==null)return m;return j?v+J(v,j):v})}
function nameList(arr,max){const ns=arr.map(a=>a.name);if(max&&ns.length>max)return ns.slice(0,max).join(", ")+` 외 ${ns.length-max}명`;return ns.join(", ")}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function assignSpots(first){
  for(const a of members()){
    if(isMe(a)){a.spot=S.mySpot||"fire"}
    else if(first)a.spot=pick(["fire","fire","huts","beach","forest","well","east"]);
    else{
      let s;
      if(a.hunger>0||a.food<1.5)s=pick(["beach","forest","east"]);
      else if(a.coop<.3&&R()<.5)s="cliff";
      else if(a.cha>.6&&R()<.55)s="fire";
      else if(a.skill>.65&&R()<.6)s=pick(["beach","east"]);
      else s=pick(["forest","huts","well","fire","beach"]);
      a.spot=s;
    }
    const sp=SPOTS[a.spot],ang=R()*7,r=.02+R()*.05;a.sx=sp.x+Math.cos(ang)*r;a.sy=sp.y+Math.sin(ang)*r*.8;
  }
}
function ambient(n){

  const L=leader();
  for(let i=0;i<n;i++){
    const a=pick(ms);const pals=ms.filter(b=>b!==a).sort((x,y)=>getR(a,y)-getR(a,x));const b=R()<.7?pals[0]:pick(pals);if(!b)continue;
    const oth=ms.filter(x=>x!==a&&x!==b);let pair=pick(Q.idle);
    if((pair[0].includes("{l}")&&(!L||L===a||L===b))||(pair[0].includes("{x}")&&!oth.length))pair=Q.idle[0];
    const x=pick(oth.length?oth:ms);
    talkPair(a,b,pair,{l:L?L.name:"",x:x?x.name:""},0);

}

  for(const m of members())if(m.follow===a.id)m.follow=null;
}
function breakAlly(x,why){

function encounters(ms){

    if(isMe(a))continue;
    for(let k=0;k<3;k++){
      let b=null,bd=9;
      for(let t=0;t<4;t++){const c=pick(ms);if(c===a)continue;const d=Math.hypot(c.x-a.x,c.y-a.y)-getR(a,c)*.15;if(d<bd){bd=d;b=c}}
      if(!b)continue;
      if(b.food<1&&a.food>2.2&&R()<a.coop*.7){
        a.food-=1;b.food+=1;addR(b,a,.25);addR(a,b,.06);a.rep+=.08;
        if(isMe(b)){log("bond","나눔 받음",`굶주린 ${ME().name}에게 ${nm(a,"이")} 식량을 나눠 주었다.`);say(a,pick(Q.share)[0],b,2)}
        else{if(b.hunger>=1&&R()<.35)log("bond","나눔",`굶주리던 ${b.name}에게 ${nm(a,"이")} 식량을 나눴다.`);if(talk<5&&R()<.35){talk++;talkPair(a,b,pick(Q.share),{},1)}}
        note(b,`${a.name}에게 식량을 받음`);note(a,`${b.name}에게 식량을 나눠 줌`);
      } else if(a.food<1.2&&b.food>2.5&&R()<(1-a.hon)*(.3+a.greed*.5)*.6){
        const amt=Math.min(1.6,b.food*.3);b.food-=amt;a.food+=amt;
        if(R()<.5){
          addR(b,a,-.45);a.rep-=.3;
          for(let w=0;w<3;w++){const x=pick(ms);if(x!==a)addR(x,a,-.12)}
          log(isMe(b)?"me":"conflict","도둑질 발각",`${nm(a,"이")} ${b.name}의 식량을 훔치다 들켰다.`);
          note(a,`${b.name}의 식량을 훔치다 들킴`);note(b,`${a.name}에게 도둑맞음`);
          const p=pick(Q.caught);if(isMe(b))say(a,p[1],b,2);else talkPair(b,a,p,{},2);
        } else {b.griev+=.05;a.sin=true;note(a,`몰래 ${b.name}의 식량을 가져감`);if(isMe(b))log("me","식량이 줄었다",`누군가 ${ME().name}의 식량 ${amt.toFixed(1)}을 몰래 가져갔다.`)}
      } else {
        const sim=1-(Math.abs(a.coop-b.coop)+Math.abs(a.hon-b.hon)+Math.abs(a.greed-b.greed))/3;
        addR(a,b,(sim-.55)*.1+(R()-.5)*.05);if(!isMe(b))addR(b,a,(sim-.55)*.1+(R()-.5)*.05);
        let c=null,cv=.3;
        for(const x of ms){if(x===a||x===b)continue;const v=Math.abs(getR(a,x));if(v>cv){cv=v;c=x}}
        if(c&&!isMe(b)&&getR(b,a)>0){addR(b,c,getR(a,c)*.1*(.5+a.cha));if(getR(a,c)<-.3&&talk<5&&R()<.06){talk++;talkPair(a,b,pick(Q.gossip),{c:c.name},1);note(c,`${a.name}의 뒷말에 오름`)}}
      }
    }
  }
}
function morning(){
  const ms=members(),n=ms.length;if(n<2)return;
  S.tick++;
  if(S.drought>0){S.drought--;S.fert=.42+R()*.12}else if(S.boom>0){S.boom--;S.fert=1.8}else S.fert=.95+(R()-.5)*.35;
  if(S.tick>3&&!S.drought&&!S.boom&&R()<.07){if(R()<.55){S.drought=2;log("world","가뭄","비가 그쳤다. 이틀 동안 수확이 크게 줄어든다.")}else{S.boom=1;log("world","풍년","해안에 물고기 떼가 몰려왔다. 오늘은 수확이 넘친다.")}}
  for(const a of ms)a.harvest=(.55+a.skill*.95)*S.fert*(.8+R()*.4)*(a.hunger>1?.8:1);
  const pool=ms.reduce((s,a)=>s+a.harvest,0),avgH=pool/n,L=leader();
  if(S.rule==="equal"){for(const a of ms)a.got=pool*.97/n}
  else if(S.rule==="merit"){for(const a of ms)a.got=a.harvest*.85+pool*.15/n}
  else if(S.rule==="leader"&&L){
    const cut=pool*(.08+L.greed*.3);let sw=0;const w={};
    for(const a of ms)if(a!==L){w[a.id]=.6+1.4*Math.max(0,getR(L,a));sw+=w[a.id]}
    for(const a of ms)a.got=a===L?cut:(pool-cut)*w[a.id]/sw;
  } else for(const a of ms)a.got=a.harvest;
  for(const a of ms){
    a.food+=a.got;
    if(a.got<avgH*.75&&a.harvest>a.got*1.15)a.griev+=.07;
    if(S.rule==="equal"&&a.harvest>a.got*1.35&&a.coop<.5)a.griev+=.04;
    if(S.rule==="leader"&&L&&a!==L&&a.got<avgH*.8)a.griev+=.03;
    if(a.got>a.harvest*1.25)a.griev-=.02;
  }
  if(meIn())log("me","아침 수확",`${S.rule==="none"?"각자 거둔 대로":`'${RULES[S.rule]}' 규칙에 따라`} ${ME().name}의 몫은 식량 ${ME().got.toFixed(1)}.`);
  assignSpots();encounters(ms);leadership();factions();ambient(2);
}
function afternoon(){

  S.tick++;

function respect(a,b){return getR(a,b)*1.1+b.cha*.35+clamp(b.rep,-1,1)*.25+(b.id===S.leader?.12:0)+(isMe(b)&&S.allies.has(a.id)?.2:0)}
function leadership(){
  const ms=members(),n=ms.length;if(n<3)return;
  const cnt={};
  for(const a of ms){if(isMe(a)){a.follow=null;continue}let best=null,bs=.45;for(const b of ms){if(b===a)continue;const s=respect(a,b);if(s>bs){bs=s;best=b}}a.follow=best?best.id:null;if(best)cnt[best.id]=(cnt[best.id]||0)+1}
  S.cnt=cnt;
  const ranked=ms.filter(a=>cnt[a.id]&&!isMe(a)).sort((x,y)=>cnt[y.id]-cnt[x.id]);
  const L=leader();
  if(!L){
    const c=ranked[0];
    if(S.tick>=2&&c&&cnt[c.id]>=Math.max(2,Math.ceil(n*.26))&&c.amb>.3){
      const first=!S.hadLeader;S.leader=c.id;S.hadLeader=true;c.st.led++;
      log("power",first?"첫 지도자 등장":"새 지도자",`${nm(c,"이")} ${cnt[c.id]}명의 지지를 모아 마을을 이끌기 시작했다. 누구도 뽑은 적은 없다.`);
      note(c,"지도자가 됨");say(c,pick(Q.rise),null,2);
    }
  } else {
    const ch=ranked.find(a=>a!==L);
    if(ch&&cnt[ch.id]>=Math.max(2,(cnt[L.id]||0)*1.4)&&ch.amb>.55&&S.tick-S.lastVote>=2){
      S.lastVote=S.tick;let yc=0,yl=0;say(ch,pick(Q.challenge),L,2);
      for(const a of ms){if(a===ch){yc++;continue}if(a===L){yl++;continue}(respect(a,ch)+(R()-.5)*.15>respect(a,L))?yc++:yl++}
      if(yc>yl){S.leader=ch.id;ch.st.led++;log(isMe(L)?"me":"power",isMe(L)?"자리를 빼앗겼다":"권력 교체",`${nm(ch,"이")} ${L.name}에게 도전했다. ${yc} 대 ${yl}, 지도자가 바뀌었다.`);note(ch,`${nm(L,"을")} 꺾고 지도자가 됨`);note(L,"도전에 밀려 물러남");addR(L,ch,-.4)}
      else{log("vote","도전 실패",`${nm(ch,"이")} 지도자 자리에 도전했지만 ${yl} 대 ${yc}로 밀렸다.`);ch.rep-=.2;addR(L,ch,-.35);note(ch,"지도자 도전 실패")}
    }
  }
}
function prefRule(a){if(a.greed>.6&&a.hon<.5)return"leader";if(a.coop>.62)return"equal";return"merit"}
function voteRule(rule,prop){
  const ms=members(),avgS=ms.reduce((s,a)=>s+a.skill,0)/ms.length,L=leader();let y=0;
  for(const a of ms){
    let v=0;
    if(rule==="equal")v=(a.skill<avgS?.3:-.2)+(a.coop-.5)*.6;
    else if(rule==="merit")v=(a.skill>avgS?.3:-.1)+(a.hon-.5)*.4;
    else if(rule==="leader")v=(L?getR(a,L)*.9+(a.follow===L.id?.25:0):0)-.25;
    else v=(a.skill>avgS?.15:-.25)+(a.greed-.5)*.4;
    v+=getR(a,prop)*.4+(R()-.5)*.2;
    if(a===prop)v=1;
    if(v>0)y++;
  }
  return {y,n:ms.length,pass:y>ms.length/2};
}
function governance(){
  const ms=members(),n=ms.length;if(n<3)return;
  const L=leader();
  if(S.tick-S.lastVote>=2){
    if(L&&!isMe(L)&&S.tick-S.ruleSince>=2&&prefRule(L)!==S.rule){
      const r=prefRule(L),v=voteRule(r,L);S.lastVote=S.tick;say(L,fill(pick(Q.rule),{r:RULES[r]}),null,2);
      if(v.pass){S.prevRule=S.rule;S.rule=r;S.ruleSince=S.tick;log("vote","규칙 채택",`${nm(L,"이")} '${RULES[r]}'${J(RULES[r],"을")} 제안했다. ${v.n}명 중 ${v.y}명 찬성. ${RULE_LONG[r]}.`)}
      else{L.rep-=.15;log("vote","제안 부결",`${L.name}의 '${RULES[r]}' 제안이 ${v.n}명 중 ${v.y}명 찬성으로 부결됐다.`)}
      return;
    }
    if(!L&&S.rule==="none"&&S.tick>=2&&R()<.2){
      const cands=ms.filter(a=>a.coop>.55&&!isMe(a));if(cands.length){
        const p=pick(cands),r=p.hon>.6?"merit":"equal",v=voteRule(r,p);S.lastVote=S.tick;say(p,fill(pick(Q.rule),{r:RULES[r]}),null,2);
        if(v.pass){S.rule=r;S.ruleSince=S.tick;log("vote","첫 규칙",`${nm(p,"이")} 모두를 불러 '${RULES[r]}'${J(RULES[r],"을")} 제안했다. ${v.n}명 중 ${v.y}명 찬성으로 채택.`)}
        else log("vote","모임 무산",`${nm(p,"이")} '${RULES[r]}'${J(RULES[r],"을")} 제안했지만 ${v.y}명만 찬성했다.`);
        return;
      }
    }
  }
  const mg=ms.reduce((s,a)=>s+a.griev,0)/n;
  if(L&&mg>.28&&S.tick-S.lastVote>=3){
    S.lastVote=S.tick;
    const init=ms.filter(a=>a!==L&&!isMe(a)).sort((x,y)=>y.griev-x.griev)[0];if(!init)return;
    say(init,pick(Q.impeach),L,2);
    let y=0;
    for(const a of ms){if(a===L)continue;if(isMe(a)){if(getR(a,L)<0)y++;continue}const need=a.follow===L.id?.5:.26;if(a.griev>need||getR(a,L)<-.15||a===init)y++}
    if(y>n/2){
      S.leader=null;L.rep-=.5;for(const a of ms)if(a!==L)addR(a,L,-.08);
      if(S.rule==="leader"){S.rule=S.prevRule==="leader"?"none":S.prevRule;S.ruleSince=S.tick}
      log(isMe(L)?"me":"power",isMe(L)?"탄핵당했다":"탄핵",`${nm(init,"이")} 불만을 모아 탄핵을 요구했다. ${n}명 중 ${y}명 찬성, ${nm(L,"은")} 자리에서 내려왔다.`);
      note(L,"탄핵당함");note(init,"탄핵을 주도함");
    } else {
      log("vote","탄핵 부결",`${nm(init,"이")} 탄핵을 요구했지만 ${y}명만 동참했다.`);
      if(!isMe(L)&&L.amb>.62&&L.hon<.5){
        const take=init.food*.5;init.food-=take;L.food+=take;addR(init,L,-.4);
        for(const a of ms)if(a!==L&&a.griev>.3)addR(a,L,-.1);
        log("conflict","보복",`${nm(L,"은")} 탄핵을 주도한 ${init.name}의 식량 절반을 빼앗았다.`);note(init,`${L.name}에게 식량을 빼앗김`);
      } else {addR(L,init,-.3);note(init,"탄핵 시도 실패")}
    }
  }
}
function factions(){
  const ms=members(),par={};const f=id=>par[id]===id?id:(par[id]=f(par[id]));
  for(const a of ms)par[a.id]=a.id;
  for(const a of ms)for(const b of ms)if(a.id<b.id&&Math.min(getR(a,b),getR(b,a))>.3)par[f(a.id)]=f(b.id);
  const g={};for(const a of ms){const r=f(a.id);(g[r]=g[r]||[]).push(a)}
  const out=[];

function endPhase(){S.actDone=S.actPh;S.awaiting=false;S.pend=null;S.ap=0;acc=0;S.mySpot=null;syncPlay()}

const statOf=(a,k)=>k==="food"?clamp(a.food/8,0,1):a[k];
function perf(a,m){let s=0;for(const k in m.w)s+=m.w[k]*statOf(a,k);return s+(R()-.5)*.7-Math.min(a.hunger,3)*.2-(a.griev>.5?.08:0)-(a.injury?.25:0)}
function expPerf(a,m){let s=0;for(const k in m.w)s+=m.w[k]*statOf(a,k);return s-Math.min(a.hunger,3)*.2-(a.injury?.25:0)}
function hint(m){
  if(m.ty==="solo"||m.ty==="team"){
    const e=Object.entries(m.w),pos=e.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>TR[x[0]]),neg=e.filter(x=>x[1]<0).map(x=>TR[x[0]]);
    return `유리: ${pos.join("·")}`+(neg.length?` · 불리: ${neg.join("·")}`:"")+(m.ty==="team"?" · 팀 결속":"");
  }
  if(m.ty==="dil")return"짝과 사이가 좋으면 협력, 탐욕이 크면 배신";
  if(m.ty==="vote")return{hate:"미움받는 사람이 위험",threat:"강하고 야망 큰 사람이 위험",weak:"솜씨 없는 사람이 위험",mirror:"원한을 산 사람이 위험"}[m.vt];
  return"지도자와 사이 나쁜 사람이 위험 · 지도자는 안전";
}
function heat(){const ms=members().filter(x=>!isMe(x));if(!ms.length)return 0;return ms.reduce((s,x)=>s+Math.max(0,-seen(x)),0)/ms.length*3+(S.allies.size?-.1:0)}
function myEdge(P){
  const m=P.m,me=ME(),ms=members();
  if(m.ty==="solo"||m.ty==="team"){const arr=ms.map(a=>[a,expPerf(a,m)]).sort((x,y)=>x[1]-y[1]);const r=arr.findIndex(x=>x[0]===me)/(ms.length-1);return r>=.6?["good","당신에게 유리"]:r<.35?["bad","당신에게 불리"]:["mid","보통"]}
  if(m.ty==="lead"){if(isMe(P.nom))return["good","당신은 안전 · 지명권"];if(P.cands&&P.cands.includes(me))return["bad","당신이 후보에 올랐다"];if(P.cands)return["good","후보에서 빠졌다"]}
  if(m.ty==="dil"&&P.need&&P.need.p){const v=seen(P.need.p);return v>.2?["good","짝과 가까운 사이"]:v<-.2?["bad","짝이 당신을 경계한다"]:["mid","짝과 데면데면"]}
  const h=heat();return h>.35?["bad","당신을 향한 시선이 차갑다"]:h>.15?["mid","눈치를 살펴야 한다"]:["good","당신을 노리는 사람은 적다"];
}
function dangerK(){return S.mno===0?Math.min(9,members().length-1):1}
function aimAdj(a,b){if(isMe(a))return 0;let v=0;if(isMe(b)){if(S.allies.has(a.id))v-=.8;if(S.lowKey===S.day)v-=.25}if(S.pledge[a.id]===b.id)v+=.9;return v}

function draft(ms){
  const L=leader();
  const c1=L||ms.slice().sort((x,y)=>y.cha-x.cha)[0];
  const c2=ms.filter(a=>a!==c1).sort((x,y)=>(y.cha-getR(c1,y))-(x.cha-getR(c1,x)))[0];
  const A={cap:c1,m:[c1],name:c1.name+" 팀"},B={cap:c2,m:[c2],name:c2.name+" 팀"};
  const rest=ms.filter(a=>a!==c1&&a!==c2),seq=[];let turn=A;
  while(rest.length){let bi=0,bv=-9;rest.forEach((x,i)=>{const v=getR(turn.cap,x)+x.skill*.3+(R()-.5)*.1;if(v>bv){bv=v;bi=i}});const p=rest.splice(bi,1)[0];turn.m.push(p);seq.push({T:turn,p});turn=turn===A?B:A}
  return [A,B,seq];
}
function cooperates(a,p){
  let pb=.15+a.greed*.35+a.amb*.2+(1-a.hon)*.3-a.coop*.25-getR(a,p)*.55+(S.mno>=4?.1:0);
  if(isMe(p)){if(S.allies.has(a.id))pb-=.3;if(perk("trust"))pb-=.1}
  return R()>=clamp(pb,.03,.95);
}
function voteRound(pool,scorer,forced){
  const L=leader(),choice=new Map(),tally=new Map();
  const best=(a)=>{let t=null,bv=-99;for(const b of pool){if(b===a)continue;const v=scorer(a,b)+aimAdj(a,b)+(R()-.5)*.25;if(v>bv){bv=v;t=b}}return t};
  const lt=L&&pool.includes(L)&&!isMe(L)?best(L):null;
  for(const a of pool){let t;
    const pl=S.pledge[a.id]!=null?byId(S.pledge[a.id]):null;
    if(isMe(a)&&forced&&pool.includes(forced)&&forced!==a)t=forced;
    else if(isMe(a))t=best(a);
    else if(pl&&pool.includes(pl)&&pl!==a&&R()<.75)t=pl;
    else if(L&&a!==L&&a.follow===L.id&&lt&&lt!==a&&pool.includes(L)&&R()<.55&&!(isMe(lt)&&S.allies.has(a.id)))t=lt;
    else t=best(a);
    if(!t)continue;choice.set(a,t);tally.set(t,(tally.get(t)||0)+1)}
  return {choice,tally};
}
const recv=(x,pool)=>pool.reduce((s,b)=>s+(b===x?0:getR(b,x)),0);
const ORD=["첫 번째","두 번째","세 번째","네 번째","다섯 번째","여섯 번째","일곱 번째","여덟 번째","아홉 번째","열 번째","열한 번째","열두 번째"];
function tallyBoard(tally,cands,eset){
  const arr=(cands||[...tally.keys()]).filter(a=>cands||tally.get(a));
  const mx=Math.max(1,...arr.map(a=>tally.get(a)||0));
  return arr.slice().sort((x,y)=>(tally.get(y)||0)-(tally.get(x)||0)).map(a=>({k:a.name,l:a.name,v:(tally.get(a)||0)/mx,x:`${tally.get(a)||0}표`,s:eset&&eset.has(a)?"out":""}));
}

function prepMission(m){
  const ms=members(),K=dangerK(),L=leader(),me=meIn()?ME():null,P={m,K,need:null};
  if(m.ty==="team"){const [A,B,seq]=draft(ms);Object.assign(P,{A,B,seq});if(me)P.need={kind:"team",T:A.m.includes(me)?A:B}}
  else if(m.ty==="dil"){const sh=shuffle(ms.slice());P.sh=sh;if(me){const i=sh.indexOf(me),p=i%2===0?sh[i+1]:sh[i-1];P.need=p?{kind:"dil",p}:{kind:"none",msg:"인원이 홀수라 짝이 없습니다. 이번 미션은 지켜보기만 합니다."}}}
  else if(m.ty==="vote"){if(me)P.need={kind:"vote"}}
  else if(m.ty==="lead"){
    let nom=L,acting=false;if(!nom){nom=ms.slice().sort((x,y)=>y.cha-x.cha)[0];acting=true}
    const others=ms.filter(a=>a!==nom),nc=Math.min(others.length,K+1);Object.assign(P,{nom,acting,nc});
    if(isMe(nom))P.need={kind:"nominate",nc};
    else{const sk=x=>getR(nom,x)-aimAdj(nom,x);P.cands=others.slice().sort((x,y)=>sk(x)-sk(y)).slice(0,nc);if(me)P.need={kind:"leadvote"}}
  }
  else if(me)P.need={kind:"solo"};
  return P;
}

function describe(w){
  const s=[w.ptype?w.ptype.ep:""];
  if(w.st.steal+w.st.caught>=2)s.push("배가 고프면 남의 몫에도 손을 댔다.");
  else if(w.st.share>=2)s.push("배고픈 사람을 그냥 지나치는 법이 없었다.");
  else if(w.st.talk>=6)s.push("섬의 거의 모든 사람과 이야기를 나눴다.");
  if(w.st.led)s.push("한때는 마을을 이끌었다.");
  else if(w.st.ally>=2)s.push("늘 누군가와 손을 잡고 있었다.");
  return "그는 "+s.filter(Boolean).slice(0,2).join(" ");
}
function myEpilogue(w,won){
  const t=w.st,out=[];
  if(t.bet+t.brokeAlly>=2)out.push(`그는 ${t.bet+t.brokeAlly}번 손을 놓았고, 그때마다 한 걸음씩 앞으로 나아갔다.`+(won?" 섬을 떠나는 배에서 그에게 먼저 말을 거는 사람은 없었다.":""));
  else if(t.co>=2&&t.bet===0)out.push("그는 딜레마 앞에서 한 번도 짝을 배신하지 않았다."+(won?" 탈락한 사람들 몇몇이 배웅을 나왔다.":""));
  if(t.steal+t.caught>0)out.push(`남의 식량에 손을 댄 것은 ${t.steal+t.caught}번.`+(t.caught?` 그중 ${t.caught}번은 들켰다.`:" 한 번도 들키지 않았다."));
  if(t.expose)out.push(`그가 모두 앞에서 밝힌 비밀은 ${t.expose}개였다.`);
  if(t.gossip+t.divide>=2)out.push("그가 흘린 말들은 그가 떠난 뒤에도 섬에 남았다.");
  if(t.hunt>=2)out.push(`숲으로 사냥을 나간 날이 ${t.hunt}번이었다.`);
  if(t.ally>0){const al=[...S.allies].map(byId).filter(Boolean);out.push(al.length?`끝까지 손을 놓지 않은 동맹은 ${nameList(al)}${hasB(al[al.length-1].name)?"이었다":"였다"}.`:"맺었던 동맹은 하나도 끝까지 가지 못했다.")}
  if(t.led>0)out.push(S.leader===w.id?"마지막 날까지 그는 마을의 지도자였다.":"한때 마을을 이끌었던 기억은 그가 가장 자주 꺼내 보는 장면이 되었다.");
  if(t.picked>0)out.push("그가 이름을 부른 사람들은 대부분 돌아오지 않았다.");
  if(out.length<2)out.push(won?"눈에 띄지 않는 것이 그의 전략이었다. 누구도 그를 표적으로 삼을 이유를 찾지 못했다.":"그의 이름은 몇 사람의 기억에만 남았다.");
  out.push(`섬에는 '${RULES[S.rule]}' 규칙이 남았다.`);
  return out.join(" ");

function buildEnding(){

    sl.push({k:`${S.day}일차 · 최후의 1인`,h:`${w.name} 우승`,body:(S.mno>me.story.length?`${nm(me,"이")} 떠난 뒤로도 섬의 밤은 ${S.mno-me.story.length}번 더 이어졌다. 마지막까지 남은 사람은 ${was(w.name)}. `:`마지막 밤, 둘 중 남은 사람은 ${was(w.name)}. `)+`${w.job} 출신으로, ${w.why.replace(/왔다$/,"온 사람이었다")}. `+(r>.3?`그는 떠난 ${nm(me,"을")} 좋은 사람으로 기억했다.`:r<-.3?`그는 ${me.name}의 이름을 다시 꺼내지 않았다.`:`그는 ${me.name}에 대해 별말을 하지 않았다.`),after:"다시 들어가면 다른 섬, 다른 사람들이 기다린다."})}

function finish(){S.over=true;clearSave();S.winner=members()[0]||null;S.slides=buildEnding();S.slide=0;if(S.winner)log(isMe(S.winner)?"me":"power","우승",`${nm(S.winner,"이")} 마지막 1인으로 남았다.`)}

  if(a.hunger>0&&a.status==="in"){ctx.fillStyle="#ff5a3c";ctx.font=`700 ${9*u}px ${bodyFont}`;ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillText("!",x+7*u,by-2*u)}
  if(L===a||S.winner===a){ctx.fillStyle="#f2b632";const cy=by-9*u,w=4.5*u;ctx.beginPath();ctx.moveTo(x-w,cy);ctx.lineTo(x-w,cy-4*u);ctx.lineTo(x-w/2,cy-2*u);ctx.lineTo(x,cy-5.5*u);ctx.lineTo(x+w/2,cy-2*u);ctx.lineTo(x+w,cy-4*u);ctx.lineTo(x+w,cy);ctx.closePath();ctx.fill()}
  ctx.font=`${mine?700:600} ${Math.max(9,(mine?10.5:9.5)*u)}px ${bodyFont}`;ctx.textAlign="center";ctx.textBaseline="top";ctx.lineWidth=3*u;ctx.strokeStyle="rgba(20,25,30,.75)";ctx.lineJoin="round";
  const lab=mine?`${a.name} (나)`:a.name;ctx.strokeText(lab,x,y+3*u);ctx.fillStyle=mine?"#ffd2b8":"#ffffff";ctx.fillText(lab,x,y+3*u);

}
function wrap(text,maxW){const out=[];let line="";for(const ch of text){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=ch;if(out.length===3)break}else line=t}if(out.length<3&&line)out.push(line);if(out.length===3&&text.length>out.join("").length)out[2]=out[2].slice(0,-1)+"…";return out}
function drawBubble(a,x,top,u,now){
  const b=a.bubble;if(!b)return;const life=(b.until-now)/b.dur;if(life<=0){a.bubble=null;return}
  const al=Math.min(1,life*4,(1-life)*8+.2);ctx.globalAlpha=al;

  let bx=clamp(x-w/2,4,W-w-4),by=top-h-8*u;if(by<4)by=4;
  ctx.fillStyle=b.me?"#fff1e8":"#ffffff";ctx.strokeStyle=b.me?"#ff7a45":"rgba(30,40,50,.35)";ctx.lineWidth=1.2*u;
  rrect(bx,by,w,h,6*u);ctx.fill();ctx.stroke();

  ctx.fillStyle="#1a282d";lines.forEach((l,i)=>ctx.fillText(l,bx+6*u,by+4*u+i*lh));

function physics(){
  const ms=members(),now=performance.now();
  for(const a of ms){
    let tx=a.sx,ty=a.sy;
    if(a.meet&&a.meet.until>now){const b=byId(a.meet.id);if(b&&b.status==="in"){tx=b.x+(a.x<b.x?-.035:.035);ty=b.y}}
    let fx=(tx-a.x)*.006,fy=(ty-a.y)*.006;
    for(const b of ms){if(a===b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)+1e-6,ux=dx/d,uy=dy/d;
      if(d<.045){fx-=ux*(.045-d)*.08;fy-=uy*(.045-d)*.08}
      if(getR(a,b)<-.35&&d<.12){fx-=ux*.0004;fy-=uy*.0004}}
    fx+=(Math.random()-.5)*.0004;fy+=(Math.random()-.5)*.0004;
    a.vx=a.vx*.85+fx;a.vy=a.vy*.85+fy;const sp=Math.hypot(a.vx,a.vy),mx=.006;if(sp>mx){a.vx*=mx/sp;a.vy*=mx/sp}
    a.x+=a.vx;a.y+=a.vy;
    const k=inIsland(a.x,a.y);if(k>.86){a.x=ISL.cx+(a.x-ISL.cx)*.86/k;a.y=ISL.cy+(a.y-ISL.cy)*.86/k;a.vx*=.3;a.vy*=.3}
  }
  for(const a of S.agents)if(a.status==="out"&&a.fade>0){a.x+=a.exitDir.x*.003;a.y+=a.exitDir.y*.002;a.fade-=.01}
}
function playScene(){
  const sc=S.scenes.shift();if(!sc)return;const a=byId(sc.a),b=sc.b!=null?byId(sc.b):null;if(!a||a.status!=="in")return;
  const now=performance.now(),dur=Math.max(2600,1600+sc.text.length*70)*(speed===10?.5:1);
  a.bubble={text:sc.text,until:now+dur,dur,me:isMe(a)};a.said=sc.text;
  if(b&&b.status==="in"&&!isMe(a)&&Math.hypot(a.x-b.x,a.y-b.y)>.08)a.meet={id:b.id,until:now+2500};
  S.chat.unshift({d:S.day,p:S.phase,who:a.name,to:b?b.name:null,text:sc.text});if(S.chat.length>200)S.chat.pop();chatDirty=true;
  if(tab==="chat")renderChat();
}
function draw(tm){
  const now=performance.now(),me=ME(),L=leader(),u=W/400;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const {pi,Lt}=drawWorld(tm);
  if(showTies){const ms=members();
    for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++){const a=ms[i],b=ms[j],m=Math.min(getR(a,b),getR(b,a)),M=Math.max(getR(a,b),getR(b,a));
      if(m>.35){ctx.strokeStyle="rgba(80,200,230,.8)";ctx.lineWidth=1.4*u;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(a.x*W,a.y*H-8*u);ctx.lineTo(b.x*W,b.y*H-8*u);ctx.stroke()}
      else if(M<-.35){ctx.strokeStyle="rgba(240,90,70,.75)";ctx.lineWidth=1.2*u;ctx.setLineDash([3*u,4*u]);ctx.beginPath();ctx.moveTo(a.x*W,a.y*H-8*u);ctx.lineTo(b.x*W,b.y*H-8*u);ctx.stroke()}}
    ctx.setLineDash([]);}
  const vis=S.agents.filter(a=>a.status==="in"||a.fade>0).sort((a,b)=>a.y-b.y),tops=new Map();
  let ti=0;
  for(const a of vis){
    while(ti<DECO.trees.length&&DECO.trees[ti].y<a.y){const t=DECO.trees[ti++];drawTree(t.x*W,t.y*H,t.s)}
    ctx.globalAlpha=a.status==="in"?1:Math.max(0,a.fade);
    tops.set(a,drawPerson(a,a.x*W,a.y*H,u,tm,L,me));ctx.globalAlpha=1;
  }
  while(ti<DECO.trees.length){const t=DECO.trees[ti++];drawTree(t.x*W,t.y*H,t.s)}
  if(Lt.tint){ctx.fillStyle=Lt.tint;ctx.fillRect(0,0,W,H)}
  for(const a of vis)if(a.status==="in"&&a.bubble)drawBubble(a,a.x*W,tops.get(a),u,now);
  ctx.textAlign="left";ctx.textBaseline="top";ctx.font=`700 ${11*u}px ${bodyFont}`;
  const lab=S.awaiting==="act"?"행동을 고르는 중":S.awaiting==="mission"&&!S.over?"저녁 · 미션 중":S.scenes.length?"대화가 오가는 중":"";
  const head=`${S.day}일차 ${PH[pi]}`+(S.drought>0?` · 가뭄`:S.boom>0?" · 풍년":"");
  ctx.fillStyle="rgba(15,22,28,.55)";const hw=ctx.measureText(head).width+16*u;ctx.fillRect(8*u,8*u,hw,20*u);ctx.fillStyle="#ffffff";ctx.fillText(head,16*u,12*u);
  if(lab){const lw=ctx.measureText(lab).width+16*u;ctx.fillStyle="rgba(214,92,46,.92)";ctx.fillRect(8*u,32*u,lw,20*u);ctx.fillStyle="#ffffff";ctx.fillText(lab,16*u,36*u)}
}
field.addEventListener("click",e=>{if(!S)return;const r=field.getBoundingClientRect(),x=(e.clientX-r.left)/W,y=(e.clientY-r.top)/H;let best=null,bd=.06;for(const a of members()){const d=Math.hypot(a.x-x,(a.y-.03)-y);if(d<bd){bd=d;best=a}}
  S.sel=best&&!isMe(best)?best.id:null;
  if(S.pend&&S.sel!=null){const A=actionList()[S.pend.k];if(A&&A.tgt&&(!A.filt||A.filt(byId(S.sel)))){S.pend.t=S.sel;S.pend.x=null}renderAct()}
  renderProfile()});

function renderStats(){
  const ms=members(),L=leader(),me=ME();
  $("sub").textContent=`섬 #${S.seed} · ${S.start}명 중 1명만 남는다 · 미션 ${S.mno}회 진행`;
  $("sDay").textContent=`${S.day}일차 ${PH[S.phase+1]}`;
  $("sPop").textContent=ms.length;
  $("sPopK").textContent=S.over?"생존 · 종료":`생존 · 오늘 밤 −${dangerK()}`;
  $("sLead").textContent=L?(isMe(L)?`${L.name} (나)`:L.name):"없음";$("sRule").textContent=RULES[S.rule];
  $("sFood").textContent=me.status==="in"?me.food.toFixed(1):"—";
  $("sAlly").textContent=S.allies.size?[...S.allies].map(id=>byId(id).name).join(", "):"없음";

  items.push(`<span><i style="background:#8c96a0"></i>무소속 ${ms.filter(a=>!a.fac).length}</span>`);

  items.push(`<span><b style="color:var(--tag-conflict)">!</b> 굶주림</span>`);

}
function renderLog(){
  if(!logDirty)return;logDirty=false;
  $("log").innerHTML=S.log.slice(0,100).map(e=>`<li class="ty-${e.type}"><span class="d">D${e.d}${e.p>=0?" "+PH[e.p+1].slice(0,1):""}</span><div><div class="t"><em>${TAG[e.type]}</em>${esc(e.title)}</div><p>${esc(e.text)}</p></div></li>`).join("");
}
function renderAll(){if(!S)return;renderStats();renderLog();renderChat();renderMe();renderAct();renderProfile()}
for(const t of["chat","log"])$("tab-"+t).onclick=()=>{tab=t;for(const u of["chat","log"]){$("tab-"+u).setAttribute("aria-selected",String(u===t));$(u).hidden=u!==t}if(!S)return;if(t==="chat"){chatDirty=true;renderChat()}else{logDirty=true;renderLog()}};

/* ---------- 진행 ---------- */
function advance(){
  if(!S||S.awaiting||S.over)return;
  if(S.phase===-1){if(meIn()&&S.actDone!=="am"){promptAct("am");return}morning();S.phase=0}
  else if(S.phase===0){if(meIn()&&S.actDone!=="pm"){promptAct("pm");return}afternoon();S.phase=1}
  else if(S.phase===1){S.phase=2;renderAll();openMission();return}
  renderAll();saveGame();
}
function syncPlay(){const b=$("play");b.textContent=running?"일시정지":"재생";b.disabled=!S||!!(S.awaiting==="mission"||S.over)}
$("play").onclick=()=>{if(!S||S.awaiting==="mission"||S.over)return;running=!running;syncPlay()};
for(const v of[1,3,10])$("sp"+v).onclick=()=>{speed=v;for(const u of[1,3,10])$("sp"+u).setAttribute("aria-pressed",u===v?"true":"false")};
$("ties").onclick=()=>{showTies=!showTies;$("ties").setAttribute("aria-pressed",String(showTies))};
$("reset").onclick=showStart;

let last=performance.now(),profT=0;
function loop(now){
  const dt=Math.min(100,now-last);last=now;
  if(S){
    const busy=S.awaiting==="mission"||S.stage||S.result||S.over;
    if(running&&!busy){
      sceneT-=dt;
      if(S.scenes.length&&sceneT<=0){playScene();sceneT=SCENEMS[speed]}
      if(S.awaiting==="act"&&!S.scenes.length){idleT+=dt;if(idleT>9000/(speed===1?1:speed/2)&&S.idleN<3){idleT=0;S.idleN++;ambient(1)}}

    }

    profT+=dt;if(profT>800&&S.sel!=null){profT=0;renderProfile()}
  }
  requestAnimationFrame(loop);
}
function resumeToast(msg){try{const d=document.createElement('div');d.setAttribute('role','status');d.textContent=msg;

 document.body.appendChild(d);setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),450)},5200)}catch(e){}}
function serState(o){return JSON.stringify(o,(k,v)=>v instanceof Set?{__set:[...v]}:v instanceof Map?{__map:[...v]}:v)}
function desState(t){return JSON.parse(t,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?(Array.isArray(v.__set)?new Set(v.__set):Array.isArray(v.__map)?new Map(v.__map):v):v)}
const SAVE_KEY='rule-less-village-join-v1';
function saveGame(){try{if(S&&!S.over&&!S.awaiting&&!S.result&&!S.stage&&!S.cur)localStorage.setItem(SAVE_KEY,serState(Object.assign({},S,{result:null,stage:null,cur:null,pend:null,scenes:[],winner:null,slides:null})))}catch(e){}}

 try{S=s;rng=mulberry32((s.seed*2654435761+s.day*97+s.tick*13+(Date.now()&65535))>>>0);
