<title>규칙 없는 마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 관찰 기록지 — 왼쪽 실험장(캔버스), 오른쪽 개입·인물·일지. 저녁마다 미션 시트가 아래에서 올라오고, 우승 시 엔딩 슬라이드 */
:root{
  --bg:#e9eeef; --paper:#f7f9f9; --ink:#1a282d; --muted:#5a6d73; --line:#cdd7d9;
  --accent:#cf4f27; --cool:#2a6e7c; --grid:rgba(42,110,124,.08);
  --tag-power:#8a5a00; --tag-vote:#2a6e7c; --tag-conflict:#b23a2a; --tag-bond:#3f7d3a; --tag-world:#5b5b8f; --tag-leave:#6b6b6b;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --paper:#152023; --ink:#dbe6e7; --muted:#8aa0a5; --line:#283a3e;
  --accent:#ee7b50; --cool:#62b6c6; --grid:rgba(98,182,198,.07);
  --tag-power:#e0b04a; --tag-vote:#62b6c6; --tag-conflict:#ef6f5c; --tag-bond:#7fc276; --tag-world:#a3a3e0; --tag-leave:#9a9a9a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --paper:#152023; --ink:#dbe6e7; --muted:#8aa0a5; --line:#283a3e;
  --accent:#ee7b50; --cool:#62b6c6; --grid:rgba(98,182,198,.07);
  --tag-power:#e0b04a; --tag-vote:#62b6c6; --tag-conflict:#ef6f5c; --tag-bond:#7fc276; --tag-world:#a3a3e0; --tag-leave:#9a9a9a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cool)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);background:var(--paper);border-radius:6px}
.stat{padding:10px 12px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.small{font-family:var(--f-body);font-size:14px;font-weight:600}
@media (max-width:760px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(4){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--line)}}
.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.panel h2{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stage{position:relative;padding:0;overflow:hidden}
#field{display:block;width:100%;aspect-ratio:1/1;max-width:100%;cursor:pointer;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--cool)}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;min-width:84px}
button:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px;font-family:var(--f-mono)}
.seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}
.seg button:last-child{border-radius:0 4px 4px 0}
.spacer{flex:1}
.inter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.inter button{text-align:left;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
.inter button b{font-weight:600}
.inter button span{font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{color:var(--muted);font-size:13px;margin:0}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.who .nm{font-family:var(--f-display);font-size:26px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.lead{border-color:var(--tag-power);color:var(--tag-power)}
.chip.bad{border-color:var(--tag-conflict);color:var(--tag-conflict)}
.traits{display:grid;grid-template-columns:auto minmax(0,1fr) 2.4em;gap:4px 10px;align-items:center;font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cool)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.rels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:12px}
.rels div{min-width:0}
.rels .k,.sect{color:var(--muted);font-size:11px}
.sect{margin-top:12px;letter-spacing:.06em}
.plog{margin:4px 0 0;padding:0;list-style:none;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.plog b{font-family:var(--f-mono);font-weight:500;color:var(--ink);margin-right:6px}
.plog .out{color:var(--tag-conflict)}
#trend{display:block;width:100%;height:84px}
.tleg{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.tleg i{display:inline-block;width:12px;height:2px;margin-right:5px;vertical-align:3px}
.log{list-style:none;margin:0;padding:0;max-height:520px;overflow-y:auto;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .d{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.log .t{font-weight:600;font-size:13px}
.log .t em{font-style:normal;font-size:10px;font-weight:500;letter-spacing:.06em;margin-right:6px;padding:1px 6px;border-radius:3px;border:1px solid currentColor;vertical-align:1px}
.log p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ty-power em{color:var(--tag-power)}.ty-vote em{color:var(--tag-vote)}.ty-conflict em{color:var(--tag-conflict)}
.ty-bond em{color:var(--tag-bond)}.ty-world em{color:var(--tag-world)}.ty-leave em{color:var(--tag-leave)}.ty-mission em{color:var(--accent)}

/* 미션 시트 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,18,20,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:100%;max-width:720px;max-height:100%;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.sheet .lead{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.mcard{text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:6px}
.mcard .ty{font-size:11px;font-family:var(--f-mono);color:var(--accent);letter-spacing:.06em}
.mcard b{font-size:17px;line-height:1.3}
.mcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.mcard .hint{font-size:11px;color:var(--cool);margin-top:auto}
.mcard:hover{border-color:var(--accent)}
.elims{display:flex;flex-wrap:wrap;gap:6px}
.elims span{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--tag-conflict);color:var(--tag-conflict)}
.rlines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.rlines li{padding-left:12px;position:relative}
.rlines li::before{content:"";position:absolute;left:0;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.ovbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--paper);display:flex;gap:10px;align-items:center;justify-content:space-between;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovbar span{font-size:13px}


/* 미션 진행 */
.board{display:flex;flex-direction:column;gap:3px;max-height:34vh;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg)}
.board:empty{display:none}
.brow{display:grid;grid-template-columns:minmax(4.5em,auto) minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:12px;min-height:20px}
.brow .bl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.brow .bb{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.brow .bb i{display:block;height:100%;width:0;background:var(--cool);transition:width .6s ease}
.brow .bv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.brow .bx{grid-column:2/4;color:var(--muted);font-size:12px;min-width:0;overflow-wrap:anywhere}
.brow.out .bl,.brow.out .bv,.brow.out .bx{color:var(--tag-conflict)}
.brow.out .bb i{background:var(--tag-conflict)}
.brow.hot .bx{color:var(--tag-conflict);font-weight:600}
.brow.warn .bx{color:var(--tag-power);font-weight:600}
.feed{list-style:none;margin:0;padding:0;max-height:38vh;min-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.feed li{font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:2px}
.feed li.new{animation:fadein .45s ease both}
.feed .fh{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--cool);margin-top:6px}
.feed .fw{font-size:11px;color:var(--muted)}
.feed li.sys .ft{color:var(--muted)}
.feed li.hot .ft{color:var(--accent);font-weight:600}
.feed li.cut .ft{color:var(--tag-conflict);font-weight:600}
.stagesheet .spacer{flex:1}
@media (prefers-reduced-motion:reduce){.feed li.new{animation:none}.brow .bb i{transition:none}.feed{scroll-behavior:auto}}

/* 엔딩 */
.sheet.ending{background:var(--ink);color:var(--paper);border-color:var(--ink);min-height:min(520px,100%);justify-content:space-between;padding:28px 24px}
.ending .eyebrow{color:var(--accent)}
.ending h3{font-size:clamp(30px,7vw,44px)}
.ending .body{font-size:16px;line-height:1.85;max-width:34em;margin:6px 0 0;animation:fadein .7s ease both}
.ending .after{font-size:14px;line-height:1.75;opacity:.72;max-width:34em;margin:0;animation:fadein .7s .25s ease both}
.ending button{background:transparent;color:var(--paper);border-color:rgba(255,255,255,.3)}
.ending button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ending .pg{font-family:var(--f-mono);font-size:12px;opacity:.6;margin-right:auto}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.25}
.dots i.on{opacity:1}
@keyframes fadein{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ending .body,.ending .after{animation:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">사회 실험 · 서바이벌</div>
    <h1>규칙 없는 마을</h1>
    <p class="sub" id="sub">—</p>
  </header>

  <section class="stats" aria-label="현재 상태">
    <div class="stat"><div class="k">시간</div><div class="v small" id="sDay">1일차 새벽</div></div>

    <div class="stat"><div class="k">분배 규칙</div><div class="v small" id="sRule">각자 소유</div></div>
    <div class="stat"><div class="k">불평등 (지니)</div><div class="v" id="sGini">0.00</div></div>
    <div class="stat"><div class="k">평균 신뢰</div><div class="v" id="sTrust">0.00</div></div>
  </section>

  <div class="main">
    <div class="col">
      <div class="panel stage">
        <canvas id="field" aria-label="마을 주민 관찰 화면"></canvas>
        <div class="legend" id="legend"></div>
      </div>
      <div class="controls">
        <button class="primary" id="play">일시정지</button>
        <div class="seg" role="group" aria-label="속도">
          <button id="sp1" aria-pressed="false">1×</button>

          <span><i style="background:var(--cool)"></i>평균 신뢰</span>
          <span><i style="background:var(--tag-power)"></i>불만</span>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="panel">
        <h2>변수 투입</h2>
        <div class="inter">
          <button id="iDrought"><b>가뭄</b><span>3일간 수확 절반 이하</span></button>
          <button id="iBoom"><b>풍년</b><span>2일간 수확 크게 증가</span></button>
          <button id="iRumor"><b>소문 퍼뜨리기</b><span>선택한 인물의 평판 하락</span></button>
          <button id="iLuck"><b>횡재</b><span>선택한 인물이 식량 발견</span></button>
        </div>
        <p class="note">오전·오후에는 분배·파벌·권력 다툼이, 저녁에는 직접 고른 미션이 벌어집니다. 인물을 고르지 않으면 무작위로 대상이 정해집니다.</p>
      </div>

      <div class="panel" id="profile"><p class="empty">마을에서 인물을 탭하면 성격, 관계, 미션 기록이 보입니다.</p></div>

      <div class="panel">
        <h2>실험 일지</h2>
        <ul class="log" id="log"></ul>
      </div>
    </div>
  </div>
</div>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="ovbar" id="ovbar" hidden><span id="ovbarText">미션 선택 대기 중</span><button id="ovbarBtn" class="primary">미션 고르기</button></div>

<script>
(()=>{
const NAMES=["민준","서연","도윤","지우","하준","서윤","은우","하윤","시우","지아","예준","수아","주원","지안","유준","아린","건우","채원","현우","다은","지호","소율","선우","예린","연우","윤서","정우","하은","준서","시아","태오","나연","민재","서아","우진","유나","지환","다인","승현","가윤"];

const PH=["새벽","오전","오후","저녁"];
const FCOL=["#d1813a","#4f8fc0","#5aa35a","#b0629e","#c4a530","#3fa59c","#c25a5a","#7a74c8"];
const TYPES={solo:"개인전",team:"팀전",dil:"딜레마",vote:"투표",lead:"지명"};
const TR={skill:"솜씨",coop:"협동심",hon:"정직",cha:"카리스마",amb:"야망",greed:"탐욕",food:"식량"};
const KNUM=["","한","두","세","네","다섯","여섯","일곱","여덟","아홉","열"];
const MID="{n은} 크게 눈에 띄지 않게 미션을 넘겼다.";

/* ---------- 미션 60개 ---------- */

/* ---------- 유틸 ---------- */
let rng;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=()=>rng();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=arr=>arr[Math.floor(R()*arr.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hasB=n=>{const c=n.charCodeAt(n.length-1)-44032;return c>=0&&c<11172&&c%28!==0};
const J=(n,j)=>({이:hasB(n)?"이":"가",은:hasB(n)?"은":"는",을:hasB(n)?"을":"를",과:hasB(n)?"과":"와"}[j]);
const was=n=>n+(hasB(n)?"이었다":"였다");
function fill(tpl,map){return tpl.replace(/\{([a-z]+)(이|은|을|과)?\}/g,(m,k,j)=>{const v=map[k];if(v==null)return m;return j?v+J(v,j):v})}
function nameList(arr,max){const ns=arr.map(a=>a.name);if(max&&ns.length>max)return ns.slice(0,max).join(", ")+` 외 ${ns.length-max}명`;return ns.join(", ")}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S, running=true, speed=3, showTies=true, acc=0, logDirty=true;
const PHASEMS={1:1500,3:650,10:200};

const getR=(a,b)=>a.rel[b.id]||0;
const addR=(a,b,d)=>{if(a&&b&&a!==b)a.rel[b.id]=clamp(getR(a,b)+d,-1,1)};
const members=()=>S.agents.filter(a=>a.status==="in");
const byId=id=>S.agents.find(a=>a.id===id);
const leader=()=>S.leader==null?null:byId(S.leader);

function makeAgent(x,y){
  const coop=R();
  const a={id:S.nextId++,name:S.names[S.nameIdx++],x,y,vx:0,vy:0,
    amb:R(),coop,hon:R(),cha:R(),greed:clamp(R()*.7+(1-coop)*.3,0,1),skill:.2+R()*.8,
    food:3+R()*2,hunger:0,griev:0,rep:0,rel:{},status:"in",follow:null,log:[],story:[],harvest:0,got:0,fade:1,
    st:{bet:0,co:0,sab:0,named:0,picked:0,led:0}};
  S.agents.push(a);return a;
}
function note(a,t){a.log.unshift({d:S.day,t});if(a.log.length>8)a.log.pop()}
function log(type,title,text){S.log.unshift({d:S.day,p:S.phase,type,title,text});if(S.log.length>260)S.log.pop();logDirty=true}

function newSociety(seed){
  rng=mulberry32(seed);
  S={seed,day:1,phase:-1,tick:0,agents:[],names:shuffle(NAMES.slice()),nameIdx:0,nextId:0,rule:"none",prevRule:"none",leader:null,hadLeader:false,
     fert:1,drought:0,boom:0,log:[],hist:[],factions:[],lastVote:-99,lastFacLog:-99,facCount:0,ruleSince:0,sel:null,
     pool:shuffle(MISSIONS.map((_,i)=>i)),mno:0,awaiting:false,over:false,start:18,choices:null,result:null,winner:null,slides:null,slide:0,collapsed:false};
  for(let i=0;i<S.start;i++){const ang=R()*Math.PI*2,r=.1+R()*.3;makeAgent(.5+Math.cos(ang)*r,.5+Math.sin(ang)*r)}
  const ms=members();
  for(const a of ms)for(const b of ms)if(a!==b)a.rel[b.id]=(R()-.4)*.4;
  log("world","입소",`${S.start}명이 아무 규칙 없이 한 섬에 모였다. 첫날 밤 미션에서 9명이 떠나고, 그 뒤로는 매일 밤 1명씩 떠난다. 마지막 1명만 남는다.`);
  hideOverlay();running=true;syncPlay();renderAll();saveGame();
}

function leave(a,why){
  a.status="out";a.fade=1;a.outDay=S.day;
  a.exitDir=Math.min(a.x,1-a.x)<Math.min(a.y,1-a.y)?{x:a.x<.5?-1:1,y:0}:{x:0,y:a.y<.5?-1:1};
  note(a,why);
  if(S.leader===a.id){S.leader=null;log("power","지도자 공백",`${a.name}${J(a.name,"이")} 탈락하면서 마을에 지도자가 사라졌다.`);if(S.rule==="leader"){S.rule="none";S.ruleSince=S.tick}}
  for(const m of members())if(m.follow===a.id)m.follow=null;
}

/* ---------- 오전·오후 ---------- */
function encounters(ms){
  for(const a of ms){
    for(let k=0;k<3;k++){
      let b=null,bd=9;
      for(let t=0;t<4;t++){const c=pick(ms);if(c===a)continue;const d=Math.hypot(c.x-a.x,c.y-a.y)-getR(a,c)*.15;if(d<bd){bd=d;b=c}}
      if(!b)continue;
      if(b.food<1&&a.food>2.2&&R()<a.coop*.7){
        a.food-=1;b.food+=1;addR(b,a,.25);addR(a,b,.06);a.rep+=.08;
        if(b.hunger>=1&&R()<.35)log("bond","나눔",`굶주리던 ${b.name}에게 ${a.name}${J(a.name,"이")} 식량을 나눴다.`);
        note(b,`${a.name}에게 식량을 받음`);
      } else if(a.food<1.2&&b.food>2.5&&R()<(1-a.hon)*(.3+a.greed*.5)*.6){
        const amt=Math.min(1.6,b.food*.3);b.food-=amt;a.food+=amt;
        if(R()<.5){
          addR(b,a,-.45);a.rep-=.3;
          for(let w=0;w<3;w++){const x=pick(ms);if(x!==a)addR(x,a,-.12)}
          log("conflict","도둑질 발각",`${a.name}${J(a.name,"이")} ${b.name}의 식량을 훔치다 들켰다.`);
          note(a,`${b.name}의 식량을 훔치다 들킴`);note(b,`${a.name}에게 도둑맞음`);
        } else {b.griev+=.05;note(a,`몰래 ${b.name}의 식량을 가져감`)}
      } else {
        const sim=1-(Math.abs(a.coop-b.coop)+Math.abs(a.hon-b.hon)+Math.abs(a.greed-b.greed))/3;
        addR(a,b,(sim-.55)*.1+(R()-.5)*.05);addR(b,a,(sim-.55)*.1+(R()-.5)*.05);
        let c=null,cv=.3;
        for(const x of ms){if(x===a||x===b)continue;const v=Math.abs(getR(a,x));if(v>cv){cv=v;c=x}}
        if(c&&getR(b,a)>0)addR(b,c,getR(a,c)*.1*(.5+a.cha));
      }
    }
  }
}
function morning(){
  const ms=members(),n=ms.length;if(n<2)return;
  S.tick++;
  if(S.drought>0){S.drought--;S.fert=.42+R()*.12}else if(S.boom>0){S.boom--;S.fert=1.8}else S.fert=.95+(R()-.5)*.35;
  for(const a of ms)a.harvest=(.55+a.skill*.95)*S.fert*(.8+R()*.4)*(a.hunger>1?.8:1);
  const pool=ms.reduce((s,a)=>s+a.harvest,0),avgH=pool/n,L=leader();
  if(S.rule==="equal"){for(const a of ms)a.got=pool*.97/n}
  else if(S.rule==="merit"){for(const a of ms)a.got=a.harvest*.85+pool*.15/n}
  else if(S.rule==="leader"&&L){
    const cut=pool*(.08+L.greed*.3);let sw=0;const w={};
    for(const a of ms)if(a!==L){w[a.id]=.6+1.4*Math.max(0,getR(L,a));sw+=w[a.id]}
    for(const a of ms)a.got=a===L?cut:(pool-cut)*w[a.id]/sw;
  } else for(const a of ms)a.got=a.harvest;
  for(const a of ms){
    a.food+=a.got;
    if(a.got<avgH*.75&&a.harvest>a.got*1.15)a.griev+=.07;
    if(S.rule==="equal"&&a.harvest>a.got*1.35&&a.coop<.5)a.griev+=.04;
    if(S.rule==="leader"&&L&&a!==L&&a.got<avgH*.8)a.griev+=.03;
    if(a.got>a.harvest*1.25)a.griev-=.02;
  }
  encounters(ms);leadership();factions();pushHist();
}
function afternoon(){
  const ms=members();if(ms.length<2)return;
  S.tick++;
  encounters(ms);governance();leadership();factions();
  for(const a of ms){a.griev=clamp(a.griev*.95,0,1);a.rep*=.97}
  pushHist();
}
function pushHist(){const now=members();S.hist.push({gini:gini(now.map(a=>a.food)),trust:meanTrust(now),griev:now.length?now.reduce((s,a)=>s+a.griev,0)/now.length:0});if(S.hist.length>400)S.hist.shift()}

function respect(a,b){return getR(a,b)*1.1+b.cha*.35+clamp(b.rep,-1,1)*.25+(b.id===S.leader?.12:0)}
function leadership(){
  const ms=members(),n=ms.length;if(n<3)return;
  const cnt={};
  for(const a of ms){let best=null,bs=.45;for(const b of ms){if(b===a)continue;const s=respect(a,b);if(s>bs){bs=s;best=b}}a.follow=best?best.id:null;if(best)cnt[best.id]=(cnt[best.id]||0)+1}
  S.cnt=cnt;
  const ranked=ms.filter(a=>cnt[a.id]).sort((x,y)=>cnt[y.id]-cnt[x.id]);
  const L=leader();
  if(!L){
    const c=ranked[0];
    if(S.tick>=2&&c&&cnt[c.id]>=Math.max(2,Math.ceil(n*.26))&&c.amb>.3){
      const first=!S.hadLeader;S.leader=c.id;S.hadLeader=true;c.st.led++;
      log("power",first?"첫 지도자 등장":"새 지도자",`${c.name}${J(c.name,"이")} ${cnt[c.id]}명의 지지를 모아 마을을 이끌기 시작했다. 누구도 뽑은 적은 없다.`);
      note(c,"지도자가 됨");
    }
  } else {
    const ch=ranked.find(a=>a!==L);
    if(ch&&cnt[ch.id]>=Math.max(2,(cnt[L.id]||0)*1.4)&&ch.amb>.55&&S.tick-S.lastVote>=2){
      S.lastVote=S.tick;let yc=0,yl=0;
      for(const a of ms){if(a===ch){yc++;continue}if(a===L){yl++;continue}(respect(a,ch)+(R()-.5)*.15>respect(a,L))?yc++:yl++}
      if(yc>yl){S.leader=ch.id;ch.st.led++;log("power","권력 교체",`${ch.name}${J(ch.name,"이")} ${L.name}에게 도전했다. ${yc} 대 ${yl}, 지도자가 바뀌었다.`);note(ch,`${L.name}${J(L.name,"을")} 꺾고 지도자가 됨`);note(L,"도전에 밀려 물러남");addR(L,ch,-.4)}
      else{log("vote","도전 실패",`${ch.name}${J(ch.name,"이")} 지도자 자리에 도전했지만 ${yl} 대 ${yc}로 밀렸다.`);ch.rep-=.2;addR(L,ch,-.35);note(ch,"지도자 도전 실패")}
    }
  }
}
function prefRule(a){if(a.greed>.6&&a.hon<.5)return"leader";if(a.coop>.62)return"equal";return"merit"}
function voteRule(rule,prop){
  const ms=members(),avgS=ms.reduce((s,a)=>s+a.skill,0)/ms.length,L=leader();let y=0;
  for(const a of ms){
    let v=0;
    if(rule==="equal")v=(a.skill<avgS?.3:-.2)+(a.coop-.5)*.6;
    else if(rule==="merit")v=(a.skill>avgS?.3:-.1)+(a.hon-.5)*.4;
    else if(rule==="leader")v=(L?getR(a,L)*.9+(a.follow===L.id?.25:0):0)-.25;
    v+=getR(a,prop)*.4+(R()-.5)*.2;
    if(a===prop)v=1;
    if(v>0)y++;
  }
  return {y,n:ms.length,pass:y>ms.length/2};
}
function governance(){
  const ms=members(),n=ms.length;if(n<3)return;
  const L=leader();
  if(S.tick-S.lastVote>=2){
    if(L&&S.tick-S.ruleSince>=2&&prefRule(L)!==S.rule){
      const r=prefRule(L),v=voteRule(r,L);S.lastVote=S.tick;
      if(v.pass){S.prevRule=S.rule;S.rule=r;S.ruleSince=S.tick;log("vote","규칙 채택",`${L.name}${J(L.name,"이")} '${RULES[r]}'${J(RULES[r],"을")} 제안했다. ${v.n}명 중 ${v.y}명 찬성. ${RULE_LONG[r]}.`)}
      else{L.rep-=.15;log("vote","제안 부결",`${L.name}의 '${RULES[r]}' 제안이 ${v.n}명 중 ${v.y}명 찬성으로 부결됐다.`)}
      return;
    }
    if(!L&&S.rule==="none"&&S.tick>=2&&R()<.2){
      const cands=ms.filter(a=>a.coop>.55);if(cands.length){
        const p=pick(cands),r=p.hon>.6?"merit":"equal",v=voteRule(r,p);S.lastVote=S.tick;
        if(v.pass){S.rule=r;S.ruleSince=S.tick;log("vote","첫 규칙",`${p.name}${J(p.name,"이")} 모두를 불러 '${RULES[r]}'${J(RULES[r],"을")} 제안했다. ${v.n}명 중 ${v.y}명 찬성으로 채택.`)}
        else log("vote","모임 무산",`${p.name}${J(p.name,"이")} '${RULES[r]}'${J(RULES[r],"을")} 제안했지만 ${v.y}명만 찬성했다.`);
        return;
      }
    }
  }
  const mg=ms.reduce((s,a)=>s+a.griev,0)/n;
  if(L&&mg>.28&&S.tick-S.lastVote>=3){
    S.lastVote=S.tick;
    const init=ms.filter(a=>a!==L).sort((x,y)=>y.griev-x.griev)[0];
    let y=0;
    for(const a of ms){if(a===L)continue;const need=a.follow===L.id?.5:.26;if(a.griev>need||getR(a,L)<-.15||a===init)y++}
    if(y>n/2){
      S.leader=null;L.rep-=.5;for(const a of ms)if(a!==L)addR(a,L,-.08);
      if(S.rule==="leader"){S.rule=S.prevRule==="leader"?"none":S.prevRule;S.ruleSince=S.tick}
      log("power","탄핵",`${init.name}${J(init.name,"이")} 불만을 모아 탄핵을 요구했다. ${n}명 중 ${y}명 찬성, ${L.name}${J(L.name,"은")} 자리에서 내려왔다.`);
      note(L,"탄핵당함");note(init,"탄핵을 주도함");
    } else {
      log("vote","탄핵 부결",`${init.name}${J(init.name,"이")} 탄핵을 요구했지만 ${y}명만 동참했다.`);
      if(L.amb>.62&&L.hon<.5){
        const take=init.food*.5;init.food-=take;L.food+=take;addR(init,L,-.4);
        for(const a of ms)if(a!==L&&a.griev>.3)addR(a,L,-.1);
        log("conflict","보복",`${L.name}${J(L.name,"은")} 탄핵을 주도한 ${init.name}의 식량 절반을 빼앗았다.`);note(init,`${L.name}에게 식량을 빼앗김`);
      } else {addR(L,init,-.3);note(init,"탄핵 시도 실패")}
    }
  }
}
function factions(){
  const ms=members(),par={};const f=id=>par[id]===id?id:(par[id]=f(par[id]));
  for(const a of ms)par[a.id]=a.id;
  for(const a of ms)for(const b of ms)if(a.id<b.id&&Math.min(getR(a,b),getR(b,a))>.3)par[f(a.id)]=f(b.id);
  const g={};for(const a of ms){const r=f(a.id);(g[r]=g[r]||[]).push(a)}
  const out=[];
  for(const k in g){const arr=g[k];if(arr.length<3)continue;
    let core=arr[0],cs=-9;for(const a of arr){const s=arr.reduce((t,b)=>t+(a===b?0:getR(b,a)),0);if(s>cs){cs=s;core=a}}
    out.push({core:core.id,name:core.name+"파",ids:arr.map(a=>a.id),col:FCOL[core.id%FCOL.length]});}
  out.sort((x,y)=>y.ids.length-x.ids.length);
  for(const a of S.agents)a.fac=null;
  for(const fa of out)for(const id of fa.ids)byId(id).fac=fa;
  if(out.length!==S.facCount&&S.tick-S.lastFacLog>=2){
    if(out.length>S.facCount)log("bond","무리 형성",out.length===1?`${out[0].name} ${out[0].ids.length}명이 서로를 챙기기 시작했다.`:`마을의 무리가 ${out.length}개가 됐다: ${out.map(x=>x.name+" "+x.ids.length+"명").join(", ")}.`);
    else log("bond","무리 해체",out.length?`무리가 ${out.length}개로 줄었다: ${out.map(x=>x.name).join(", ")}.`:"끈끈하던 무리가 흩어졌다.");
    S.lastFacLog=S.tick;
  }
  S.facCount=out.length;S.factions=out;
}
function gini(v){const n=v.length;if(n<2)return 0;const s=v.slice().sort((a,b)=>a-b);let num=0,sum=0;for(let i=0;i<n;i++){num+=(2*(i+1)-n-1)*s[i];sum+=s[i]}return sum?num/(n*sum):0}
function meanTrust(ms){let s=0,c=0;for(const a of ms)for(const b of ms)if(a!==b){s+=getR(a,b);c++}return c?s/c:0}

/* ---------- 저녁 미션 ---------- */
const statOf=(a,k)=>k==="food"?clamp(a.food/8,0,1):a[k];
function perf(a,m){let s=0;for(const k in m.w)s+=m.w[k]*statOf(a,k);return s+(R()-.5)*.7-Math.min(a.hunger,3)*.2-(a.griev>.5?.08:0)}
function hint(m){
  if(m.ty==="solo"||m.ty==="team"){
    const e=Object.entries(m.w),pos=e.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>TR[x[0]]),neg=e.filter(x=>x[1]<0).map(x=>TR[x[0]]);
    return `유리: ${pos.join("·")}`+(neg.length?` · 불리: ${neg.join("·")}`:"")+(m.ty==="team"?" · 팀 결속":"");
  }
  if(m.ty==="dil")return"짝과 사이가 좋으면 협력, 탐욕이 크면 배신";
  if(m.ty==="vote")return{hate:"미움받는 사람이 위험",threat:"강하고 야망 큰 사람이 위험",weak:"솜씨 없는 사람이 위험",mirror:"원한을 산 사람이 위험"}[m.vt];
  return"지도자와 사이 나쁜 사람이 위험 · 지도자는 안전";
}
function dangerK(){return S.mno===0?Math.min(9,members().length-1):1}

function draft(ms){
  const L=leader();
  const c1=L||ms.slice().sort((x,y)=>y.cha-x.cha)[0];

    beat(`1차 투표 결과, ${nm(rounds[0].out,"이")} ${rounds[0].v}표로 가장 많은 표를 받았다.`,{c:"cut",board:tallyBoard(rounds[0].tally,null,new Set([rounds[0].out]))});
    for(let r=1;r<rounds.length;r++)beat(`${r+1}차 투표. 남은 사람끼리 다시 쪽지를 썼다. ${nm(rounds[r].out,"이")} ${rounds[r].v}표로 탈락.`,{h:r===1?"재투표":null,board:tallyBoard(rounds[r].tally,null,new Set([rounds[r].out])),c:"cut"});
    lines.push("득표: "+ms.filter(a=>first.get(a)).sort((x,y)=>first.get(y)-first.get(x)).slice(0,4).map(a=>`${a.name} ${first.get(a)}표`).join(" · "));
    if(K>1)lines.push(`${K}번에 걸쳐 투표가 반복됐다.`);
    if(L&&followN>=2)lines.push(`${nm(L,"을")} 따르는 사람들은 대체로 같은 이름을 적었다.`);
  }
  else {
    let nom=L,acting=false;if(!nom){nom=ms.slice().sort((x,y)=>y.cha-x.cha)[0];acting=true}
    const others=ms.filter(a=>a!==nom),nc=Math.min(others.length,K+1);
    const cands=others.slice().sort((x,y)=>getR(nom,x)-getR(nom,y)).slice(0,nc);
    P(nom,(acting?"지도자가 없어 {n이} 대신 나섰다. ":"")+m.nom,{t:nameList(cands,4)});nom.st.picked++;
    const lt=cands[0],tally=new Map(),ballots=[];
    for(const a of others){
      const opts=cands.filter(c=>c!==a);if(!opts.length)continue;let t;
      if(a.follow===nom.id&&lt!==a&&R()<.5)t=lt;
      else{let bv=-99;for(const c of opts){const v=-getR(a,c)+(R()-.5)*.25;if(v>bv){bv=v;t=c}}}
      tally.set(t,(tally.get(t)||0)+1);ballots.push([a,t]);
      if(cands.includes(a))P(a,"{n은} {x}에게 지목당한 채 {t}에게 표를 던졌다.",{x:nom.name,t:t.name});else P(a,"{n은} 후보 중 {t}에게 표를 던졌다.",{t:t.name});
    }
    cands.forEach(c=>c.st.named++);
    const ranked=cands.slice().sort((x,y)=>(tally.get(y)||0)-(tally.get(x)||0)||getR(nom,x)-getR(nom,y));
    elim=ranked.slice(0,K);eset=new Set(elim);if(ranked[K])ex.get(ranked[K]).close=true;
    ranked.forEach(c=>ex.get(c).votes=tally.get(c)||0);
    beat(acting?`지도자가 없다. 침묵 끝에 ${nm(nom,"이")} 앞으로 나섰다.`:`지도자 ${nm(nom,"이")} 자리에서 일어섰다. 그는 이번 미션에서 안전하다.`,{h:"지명"});
    const shown=[];
    cands.forEach((c,i)=>{shown.push(c);beat(`${ORD[i]||(i+1)+"번째"} 이름: ${c.name}.`+(getR(c,nom)>.3?` ${nm(c,"은")} 자기 이름이 불릴 줄 몰랐다.`:""),{board:shown.map(x=>({k:"c"+x.name,l:x.name,x:"지명됨"})),c:i===0?"hot":""})});
    const angry=cands.slice().sort((x,y)=>y.griev-x.griev)[0];if(angry)beat(`${nm(angry,"은")} ${nm(nom,"을")} 한참 노려봤다.`,{c:"hot"});
    beat(`나머지 사람들이 후보 중 한 명의 이름을 적는다.`,{h:"투표"});
    const run=new Map();
    shuffle(ballots).forEach(([a,t])=>{run.set(t,(run.get(t)||0)+1);beat(`쪽지를 펼쳤다. ${was(t.name)}`,{w:a.name+" 씀",board:tallyBoard(run,cands)})});
    beat(K>1?`후보 ${cands.length}명 중 ${K}명이 떠나고, ${nm(cands.find(c=>!eset.has(c))||nom,"이")} 살아남았다.`:`${nm(elim[0],"이")} ${tally.get(elim[0])||0}표로 떠난다.`,{c:"cut",board:tallyBoard(tally,cands,eset)});
    for(const c of cands)if(!eset.has(c)){addR(c,nom,-.4);c.griev+=.2}
    lines.push(`지명한 사람: ${nom.name}${acting?" (지도자 대행)":""} · 후보 ${cands.length}명`);
    lines.push("득표: "+ranked.slice(0,4).map(a=>`${a.name} ${tally.get(a)||0}표`).join(" · "));
  }

  beat(elim.length>1?`${nameList(elim)}. ${KNUM[elim.length]||elim.length} 명이 짐을 챙겨 해변으로 걸어갔다.`:`${nm(elim[0],"은")} 짐을 챙겨 해변으로 걸어갔다. 아무도 따라가지 않았다.`,{h:"그날 밤",c:"cut"});
  const base=elim.length>1?`그날 밤 ${nameList(elim)}, ${KNUM[elim.length]||elim.length} 명이 한꺼번에 섬을 떠났다.`:`그날 밤 ${nm(elim[0],"이")} 섬을 떠났다.`;
  for(const a of ms){
    const e=ex.get(a);let after;
    if(eset.has(a))after=elim.length>1?`그날 밤 그를 포함한 ${KNUM[elim.length]||elim.length} 명이 섬을 떠났다.`:"그날 밤 그는 섬을 떠났다.";
    else after=base+(e.close?" 그는 한 끗 차이로 살아남았다.":"")+(e.votes>0?` 그 자신도 ${e.votes}표를 받았다.`:"");
    a.story.push({d:S.day,t:m.t,ty:m.ty,text:parts.get(a).join(" "),after,out:eset.has(a)});
  }
  for(const e of elim)leave(e,`'${m.t}'에서 탈락`);
  log("mission",`${S.mno+1}번째 미션 · ${m.t}`,lines.join(" "));
  log("leave",elim.length>1?`${elim.length}명 탈락`:"탈락",`${nameList(elim)}${J(elim[elim.length-1].name,"이")} 섬을 떠났다. 남은 사람 ${members().length}명.`);
  S.mno++;
  factions();
  return {m,elim,lines,K,beats:BT};
}

function describe(w){
  const s=[];
  if(w.amb>.65)s.push("처음부터 이기러 온 사람이었다.");else if(w.amb<.3)s.push("처음에는 우승에 관심이 없어 보였다.");
  if(w.hon<.35)s.push("필요하면 거짓말도 마다하지 않았다.");else if(w.hon>.7)s.push("끝까지 거짓말을 할 줄 몰랐다.");
  if(w.coop>.65)s.push("배고픈 사람을 그냥 지나치는 법이 없었다.");else if(w.coop<.3)s.push("누구에게도 기대지 않았다.");
  if(w.cha>.65)s.push("그가 입을 열면 사람들이 조용해졌다.");
  if(w.skill>.75)s.push("손에 잡히는 일은 무엇이든 해냈다.");
  return s.length?"그는 "+s.slice(0,2).join(" "):"그는 눈에 띄는 사람이 아니었다.";
}
function epilogue(w){
  const t=w.st,out=[];
  if(t.bet>=2)out.push(`그는 ${t.bet}번 손을 놓았고, 그때마다 한 걸음씩 앞으로 나아갔다. 섬을 떠나는 배에서 그에게 먼저 말을 거는 사람은 없었다.`);
  else if(t.sab>0)out.push("아무도 모르는 일 몇 가지는 끝내 그만의 비밀로 남았다. 사람들은 그를 운이 좋았던 사람으로만 기억했다.");
  else if(t.co>=2&&t.bet===0)out.push("끝까지 누구도 배신하지 않은 사람이 마지막에 남았다. 탈락한 사람들 몇몇이 배웅을 나왔다.");
  else if(t.named>0)out.push("지목을 받고도 살아남은 그 밤을, 그는 오래 잊지 못했다.");
  else out.push("눈에 띄지 않는 것이 그의 전략이었다. 누구도 그를 표적으로 삼을 이유를 찾지 못했다.");
  if(t.led>0)out.push(S.leader===w.id?"마지막 날까지 그는 마을의 지도자였다.":"한때 마을을 이끌었던 기억은 그가 가장 자주 꺼내 보는 장면이 되었다.");
  if(t.picked>0)out.push(`그가 이름을 부른 사람들은 대부분 돌아오지 않았다.`);
  out.push(`그가 떠난 섬에는 '${RULES[S.rule]}' 규칙만 남았다.`);
  return out.join(" ");
}
function buildEnding(w){
  const sl=[{k:`${S.day}일차 · 최후의 1인`,h:w.name,body:`${S.start}명 중 마지막까지 섬에 남은 사람은 ${was(w.name)}. ${describe(w)}`,after:`${S.mno}번의 밤, ${S.mno}번의 미션. 그가 지나온 길은 이랬다.`}];
  for(const s of w.story)sl.push({k:`${s.d}일차 저녁 · ${TYPES[s.ty]}`,h:s.t,body:s.text,after:s.after});

}

function renderBoard(rows){

  const ms=members(),L=leader();
  for(const a of ms){
    let fx=(.5-a.x)*.0015,fy=(.5-a.y)*.0015;
    for(const b of ms){if(a===b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)+1e-6,ux=dx/d,uy=dy/d,r=getR(a,b);
      if(d<.07){fx-=ux*(.07-d)*.06;fy-=uy*(.07-d)*.06}
      if(r>.2&&d>.11){fx+=ux*r*.0005;fy+=uy*r*.0005}
      if(r<-.25&&d<.26){fx+=ux*r*.0009;fy+=uy*r*.0009}
      if(L&&b===L&&a.follow===L.id&&d>.14){fx+=ux*.0005;fy+=uy*.0005}}
    fx+=(Math.random()-.5)*.0006;fy+=(Math.random()-.5)*.0006;
    a.vx=a.vx*.86+fx;a.vy=a.vy*.86+fy;a.x=clamp(a.x+a.vx,.05,.95);a.y=clamp(a.y+a.vy,.05,.95);
  }
  for(const a of S.agents)if(a.status==="out"&&a.fade>0){a.x+=a.exitDir.x*.004;a.y+=a.exitDir.y*.004;a.fade-=.012}
}
function draw(){
  const ms=members(),L=leader(),s=W/400,t=performance.now()/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=col.paper;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=col.grid;ctx.lineWidth=1;
  for(let i=1;i<10;i++){const p=i*W/10;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,H);ctx.moveTo(0,p);ctx.lineTo(W,p);ctx.stroke()}
  if(showTies){
    for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++){const a=ms[i],b=ms[j],m=Math.min(getR(a,b),getR(b,a)),M=Math.max(getR(a,b),getR(b,a));
      if(m>.35){ctx.strokeStyle=col.cool;ctx.globalAlpha=Math.min(.8,(m-.3)*1.1);ctx.lineWidth=1.2*s;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke()}
      else if(M<-.35){ctx.strokeStyle=col["tag-conflict"];ctx.globalAlpha=Math.min(.7,(-M-.3)*1.3);ctx.lineWidth=1*s;ctx.setLineDash([3*s,4*s]);ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke()}}
    ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  for(const a of S.agents){
    if(a.status!=="in"&&a.fade<=0)continue;
    const x=a.x*W,y=a.y*H,r=(6+Math.min(a.food,10)*.45)*s;
    ctx.globalAlpha=a.status==="in"?1:Math.max(0,a.fade);
    if(a.hunger>0&&a.status==="in"){ctx.strokeStyle=col.accent;ctx.lineWidth=1.5*s;ctx.globalAlpha=.4+.4*Math.sin(t*5);ctx.beginPath();ctx.arc(x,y,r+5*s,0,7);ctx.stroke();ctx.globalAlpha=1}
    ctx.fillStyle=a.fac?a.fac.col:col.muted;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.strokeStyle=col.paper;ctx.lineWidth=1.5*s;ctx.stroke();
    if(L===a||(S.winner===a)){ctx.fillStyle=col["tag-power"];ctx.beginPath();const cy=y-r-3*s,w=7*s;ctx.moveTo(x-w,cy);ctx.lineTo(x-w,cy-6*s);ctx.lineTo(x-w/2,cy-3*s);ctx.lineTo(x,cy-8*s);ctx.lineTo(x+w/2,cy-3*s);ctx.lineTo(x+w,cy-6*s);ctx.lineTo(x+w,cy);ctx.closePath();ctx.fill()}
    if(S.sel===a.id){ctx.strokeStyle=col.ink;ctx.lineWidth=2*s;ctx.beginPath();ctx.arc(x,y,r+4*s,0,7);ctx.stroke()}
    ctx.fillStyle=col.ink;ctx.font=`500 ${Math.max(9,10.5*s)}px ${bodyFont}`;ctx.textAlign="center";ctx.textBaseline="top";
    ctx.fillText(a.name,x,y+r+3*s);
    ctx.globalAlpha=1;
  }
  ctx.textAlign="left";ctx.textBaseline="top";ctx.font=`600 ${11*s}px ${bodyFont}`;
  let ly=10*s;
  if(S.drought>0||S.boom>0){ctx.fillStyle=S.drought>0?col.accent:col.cool;ctx.fillText(S.drought>0?`가뭄 ${S.drought}일 남음`:`풍년 ${S.boom}일 남음`,10*s,ly);ly+=16*s}
  if(S.awaiting&&!S.over){ctx.fillStyle=col.accent;ctx.fillText("저녁 · 미션 대기 중",10*s,ly)}
}
field.addEventListener("click",e=>{const r=field.getBoundingClientRect(),x=(e.clientX-r.left)/W,y=(e.clientY-r.top)/H;let best=null,bd=.05;for(const a of members()){const d=Math.hypot(a.x-x,a.y-y);if(d<bd){bd=d;best=a}}S.sel=best?best.id:null;renderProfile()});

function drawTrend(){
  if(!S)return;const w=trend.width,h=trend.height;tctx.setTransform(1,0,0,1,0,0);tctx.clearRect(0,0,w,h);
  const hs=S.hist.slice(-60);$("trendDays").textContent=hs.length?`최근 ${Math.ceil(hs.length/2)}일`:"";
  tctx.strokeStyle=col.line;tctx.lineWidth=dpr;for(const v of[0,.5,1]){const y=h-6*dpr-(h-12*dpr)*v;tctx.beginPath();tctx.moveTo(0,y);tctx.lineTo(w,y);tctx.stroke()}
  if(hs.length<2)return;
  const line=(f,c)=>{tctx.strokeStyle=c;tctx.lineWidth=1.8*dpr;tctx.beginPath();hs.forEach((p,i)=>{const x=i/(hs.length-1)*w,y=h-6*dpr-(h-12*dpr)*clamp(f(p),0,1);i?tctx.lineTo(x,y):tctx.moveTo(x,y)});tctx.stroke()};
  line(p=>p.gini,col.accent);line(p=>(p.trust+1)/2,col.cool);line(p=>p.griev*1.6,col["tag-power"]);
}
function renderStats(){
  const ms=members(),L=leader(),hh=S.hist[S.hist.length-1];
  $("sub").textContent=`실험 #${S.seed} · ${S.start}명 중 1명만 남는다 · 미션 ${S.mno}회 진행`;
  $("sDay").textContent=`${S.day}일차 ${PH[S.phase+1]}`;
  $("sPop").textContent=ms.length;
  $("sPopK").textContent=S.over?"생존 · 우승 확정":`생존 · 오늘 밤 −${dangerK()}`;
  $("sLead").textContent=L?L.name:"없음";$("sRule").textContent=RULES[S.rule];
  $("sGini").textContent=(hh?hh.gini:gini(ms.map(a=>a.food))).toFixed(2);
  $("sTrust").textContent=(hh?hh.trust:meanTrust(ms)).toFixed(2);
  const items=S.factions.map(f=>`<span><i style="background:${f.col}"></i>${esc(f.name)} ${f.ids.length}</span>`);
  items.push(`<span><i style="background:var(--muted)"></i>무소속 ${ms.filter(a=>!a.fac).length}</span>`);
  items.push(`<span><i style="background:transparent;border:1.5px solid var(--accent)"></i>굶주림</span>`);
  $("legend").innerHTML=items.join("");
}
function renderLog(){
  if(!logDirty)return;logDirty=false;
  $("log").innerHTML=S.log.slice(0,100).map(e=>`<li class="ty-${e.type}"><span class="d">D${e.d}${e.p>=0?" "+PH[e.p+1].slice(0,1):""}</span><div><div class="t"><em>${TAG[e.type]}</em>${esc(e.title)}</div><p>${esc(e.text)}</p></div></li>`).join("");
}
function renderProfile(){
  const el=$("profile"),a=S.sel!=null&&byId(S.sel);
  if(!a){el.innerHTML=`<p class="empty">마을에서 인물을 탭하면 성격, 관계, 미션 기록이 보입니다.</p>`;return}
  const ms=members(),L=leader(),others=ms.filter(b=>b!==a);
  const fr=others.slice().sort((x,y)=>getR(a,y)-getR(a,x))[0],en=others.slice().sort((x,y)=>getR(a,x)-getR(a,y))[0];
  const chips=[];
  if(S.winner===a)chips.push(`<span class="chip lead">우승</span>`);
  if(a.status!=="in")chips.push(`<span class="chip bad">D${a.outDay} 탈락</span>`);
  if(L===a)chips.push(`<span class="chip lead">지도자 · 지지 ${(S.cnt&&S.cnt[a.id])||0}명</span>`);
  else if(a.status==="in"&&a.follow!=null&&byId(a.follow))chips.push(`<span class="chip">${esc(byId(a.follow).name)}${J(byId(a.follow).name,"을")} 따름</span>`);
  if(a.fac&&a.status==="in")chips.push(`<span class="chip" style="border-color:${a.fac.col};color:${a.fac.col}">${esc(a.fac.name)}</span>`);
  if(a.hunger)chips.push(`<span class="chip bad">${a.hunger}일째 굶주림</span>`);
  if(a.griev>.35)chips.push(`<span class="chip bad">불만 높음</span>`);
  if(a.st.bet)chips.push(`<span class="chip bad">배신 ${a.st.bet}회</span>`);
  const tr=[["야망",a.amb],["협동심",a.coop],["정직",a.hon],["카리스마",a.cha],["탐욕",a.greed],["솜씨",a.skill]];
  el.innerHTML=`<div class="who"><span class="nm">${esc(a.name)}</span><span class="num">식량 ${a.food.toFixed(1)}</span></div>
  <div class="chips">${chips.join("")}</div>
  <div class="traits">${tr.map(([k,v])=>`<span>${k}</span><div class="bar"><i style="width:${(v*100).toFixed(0)}%"></i></div><span class="num">${Math.round(v*100)}</span>`).join("")}</div>
  ${a.status==="in"&&others.length?`<div class="rels"><div><div class="k">가장 가까운 사람</div>${fr&&getR(a,fr)>.1?`${esc(fr.name)} <span class="num">+${getR(a,fr).toFixed(2)}</span>`:"아직 없음"}</div><div><div class="k">가장 싫어하는 사람</div>${en&&getR(a,en)<-.1?`${esc(en.name)} <span class="num">${getR(a,en).toFixed(2)}</span>`:"아직 없음"}</div></div>`:""}
  <div class="sect">미션 기록</div>
  <ul class="plog">${a.story.length?a.story.map(s=>`<li class="${s.out?"out":""}"><b>D${s.d}</b>${esc(s.t)} · ${s.out?"탈락":"생존"}</li>`).join(""):"<li>아직 미션을 치르지 않았다.</li>"}</ul>
  <div class="sect">개인 기록</div>
  <ul class="plog">${a.log.length?a.log.map(l=>`<li><b>D${l.d}</b>${esc(l.t)}</li>`).join(""):"<li>아직 특별한 기록이 없다.</li>"}</ul>`;
}
function renderAll(){renderStats();renderLog();renderProfile();drawTrend()}

/* ---------- 진행 ---------- */
function advance(){
  if(S.awaiting||S.over)return;
  if(S.phase===-1){morning();S.phase=0}
  else if(S.phase===0){afternoon();S.phase=1}
  else if(S.phase===1){S.phase=2;renderAll();openPicker();return}
  renderAll();saveGame();
}
function syncPlay(){const b=$("play");b.textContent=running?"일시정지":"재생";b.disabled=!!(S&&(S.awaiting||S.over))}
$("play").onclick=()=>{if(S.awaiting||S.over)return;running=!running;syncPlay()};
for(const v of[1,3,10])$("sp"+v).onclick=()=>{speed=v;for(const u of[1,3,10])$("sp"+u).setAttribute("aria-pressed",u===v?"true":"false")};
$("ties").onclick=()=>{showTies=!showTies;$("ties").setAttribute("aria-pressed",String(showTies))};
$("reset").onclick=()=>newSociety(1000+Math.floor(Math.random()*9000));

let last=performance.now();
function loop(now){
  const dt=Math.min(100,now-last);last=now;
  if(running&&!S.awaiting&&!S.over){acc+=dt;if(acc>=PHASEMS[speed]){acc=0;advance()}}
  physics();draw();
  requestAnimationFrame(loop);
}
function resumeToast(msg){try{const d=document.createElement('div');d.setAttribute('role','status');d.textContent=msg;
 d.style.cssText='position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:2147483001;max-width:min(92vw,520px);background:rgba(22,25,40,.9);color:#eef0f8;font:600 13px/1.45 "IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;padding:9px 14px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);text-align:center;transition:opacity .4s';
 document.body.appendChild(d);setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),450)},5200)}catch(e){}}
function serState(o){return JSON.stringify(o,(k,v)=>v instanceof Set?{__set:[...v]}:v instanceof Map?{__map:[...v]}:v)}
function desState(t){return JSON.parse(t,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?(Array.isArray(v.__set)?new Set(v.__set):Array.isArray(v.__map)?new Map(v.__map):v):v)}
const SAVE_KEY='rule-less-village-v1';
function saveGame(){try{if(S&&!S.over&&!S.awaiting&&!S.result)localStorage.setItem(SAVE_KEY,serState(Object.assign({},S,{result:null,stage:null,choices:null,winner:null,slides:null})))}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function resumeGame(){let s=null;try{s=desState(localStorage.getItem(SAVE_KEY))}catch(e){}
 if(!s||s.over||!Array.isArray(s.agents)||!s.agents.length||typeof s.seed!=='number')return false;
 try{S=s;rng=mulberry32((s.seed*2654435761+s.day*97+s.tick*13+(Date.now()&65535))>>>0);S.awaiting=false;S.result=null;S.stage=null;
  S.agents.forEach(a=>{a.vx=0;a.vy=0});acc=0;hideOverlay();running=true;syncPlay();renderAll()}catch(e){clearSave();return false}
 resumeToast(`${s.day}일차 ${PH[s.phase+2]||''}부터 이어서 관찰합니다 · 처음부터 하려면 ‘새 실험’`);return true}
readCols();
if(!resumeGame())newSociety(1000+Math.floor(Math.random()*9000));
resize();
requestAnimationFrame(loop);
})();
</script>
